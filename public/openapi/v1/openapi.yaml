        '404':
          $ref: '#/components/responses/NotFound'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/locations/{state}/{name}/nearby:
    get:
      summary: Nearest locations to a location
      operationId: getNearbyLocations
      description: |
        The location itself and its `limit` nearest public locations (no observation stations, never the location itself) within `radius_km`, nearest first, in any state. For "nearby" links beside a forecast: ask for the few rows you show instead of downloading a state list. The neighbours count against the hourly catalog-row budget as `count` rows, not as a list page. **Optional auth / free tier:** works without credentials; unauthenticated requests are budgeted per client address. Edge-cached like the location lists.
      tags:
      - Weather
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
