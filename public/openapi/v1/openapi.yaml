      - name: include
        in: query
        schema:
          type: string
          enum:
          - nowcast_hours
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The `/current` body, as the location route serves it.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `CurrentObservationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/ProRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/alerts:
    get:
      summary: Active NWS alerts at coordinates (Pro)
      description: |
        The active NWS alerts at arbitrary coordinates: the same body as `/api/v1/locations/{state}/{name}/alerts` (`private, no-cache`, ETagged). The point is resolved exactly as `GET /api/v1/forecast` resolves it (validation, 0.01° quantization, the coverage window); `location` names the quantized point. A Free caller (key or anonymous) gets `403 PRO_REQUIRED` before any validation.
      operationId: getAlertsByCoordinates
      tags:
      - Weather
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: string
        example: '45.33'
      - name: lon
        in: query
        required: true
        schema:
          type: string
        example: '-121.71'
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The alerts body, as the location route serves it.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `AlertsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/ProRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/nearby:
    get:
      summary: Nearest locations to a coordinate
      description: |
        The `limit` nearest public locations to a coordinate, within `radius_km`, nearest first -- what a client did with a reverse geocode and a haversine over a state list. Public, budgeted like `/locations/{state}/{name}/nearby` (charged its rows).
      operationId: getNearbyByCoordinates
      tags:
      - Locations
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      - {}
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: string
      - name: lon
        in: query
        required: true
        schema:
          type: string
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
      - name: radius_km
        in: query
        schema:
          type: number
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The nearest locations to the point.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `NearbyPointResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyPointResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
    sessionCookie:
      type: apiKey
      name: ourea_session
      in: cookie
    sessionBearer:
      type: http
      scheme: bearer
      description: 'The `session_token` from login/register sent as `Authorization: Bearer <session_token>`
        -- the same session as the `ourea_session` cookie, for clients that cannot hold cookies (mobile,
        SPA). Accepted everywhere the cookie is, including the self-service `/auth`, `/users/me` and `/billing`
        routes. Not an API key.'
  parameters:
    Prob:
      name: prob
      in: query
      required: false
      schema:
        type: string
      examples:
        snow:
          summary: P(6 in or more of snow in the next 24 h)
          value: snowfall:ge:6.000:24h
        freeze:
          summary: P(at or below 32 °F at any hour in 48 h), and the snow above
          value: snowfall:ge:6.000:24h,temperature:le:32.0:48h
      description: |
        Probability terms, comma-separated, each
        `<variable>:<ge|le>:<threshold>[:<window>[:<aggregation>]]`, answered
        in `probabilities` from the served members (see "Probabilities").
        `variable`: `temperature`, `wind_speed`, `snow_level`,
        `precipitation`, `snowfall`. `threshold` in the request's `units`.
        `window`: `<N>h` (default `24h`) or `<A>-<B>h`, hours from the first
        served hour. `aggregation`: `total` (precipitation, snowfall: the
        window total; the only one for them), `any` (default) or `all` (the
        others). A malformed term is a 400 naming it.
    Totals:
      name: totals
      in: query
      required: false
      schema:
        type: string
      example: snowfall:72h,precipitation:24-48h
      description: |
        Window totals, comma-separated `<precipitation|snowfall>[:
        <window>]`, answered in `window_totals`: the distribution of each
        member's total over the window.
    Diagnostics:
      name: diagnostics
      in: query
      required: false
      schema:
        type: string
      examples:
        provenance:
          value: provenance
        both:
          value: provenance,ptype
      description: |
        Opt-in serve-path diagnostics, comma-separated. `provenance`: each hour's `provenance` tags (which post-processing rule shaped each variable: NGR, fallback, clamps, interpolation). `ptype`: the model-native precipitation-type code quantiles (`ensemble.ptype`). Default: neither (both went to every caller; the tags alone were ~49 KB of a 240 h body). An unknown name is a 400.
    Format:
      name: format
      in: query
      required: false
      description: |
        The representation. `json` (default) or `capnp`: one standard (unpacked, `capnp::serialize` framing) Cap'n Proto message, `Content-Type: application/x-capnp`, rooted at the route's response struct in schema/ourea.capnp (each operation names it; every public route answers it) and built from the same served response as the JSON -- same values, auth, rate limits, entitlements and cache policy, on a URL of its own (Cloudflare keys on the URL and ignores `Vary`). Lengths, temperatures and speeds are in the request's `units`; the search, which takes no `units`, is metric. Errors stay JSON. Any other value is a 400. Send `Accept-Encoding: br, gzip`: the message compresses well.
      schema:
        type: string
        enum:
        - json
        - capnp
        default: json
    FeelsLike:
      name: feels_like
      in: query
      required: false
      description: |
        Which "feels like" indices to serve, a comma-separated list. `nws` (the default; absent or empty means `nws`) is the NWS apparent temperature in `ensemble.feels_like`, `daily[].feels_like_high` and `daily[].feels_like_low` -- exactly the response without the parameter. `utci` is the Universal Thermal Climate Index (Bröde et al. 2012) with a mean radiant temperature from the forecast's surface radiation, served in `ensemble.feels_like_utci`, `daily[].feels_like_utci_high` and `daily[].feels_like_utci_low` (with `utci` alone the NWS fields are omitted). **`utci` is not served yet**: its radiation inputs are not stored and it is never approximated, so any selection naming it is a `400 FEELS_LIKE_UNAVAILABLE`. A name that is no index is a `400 BAD_REQUEST` listing the names. Case and surrounding spaces are ignored; a repeated name counts once. Cap'n Proto RPC: `ForecastRequest.feelsLike`.
      schema:
        type: string
      examples:
        default:
          summary: the NWS index (same as omitting the parameter)
          value: nws
        both:
          summary: both indices (400 FEELS_LIKE_UNAVAILABLE until UTCI is served)
          value: nws,utci
  headers:
    ETag:
      description: |
        A strong entity tag naming the served cycle (the reference init and every contributing model's own cycle), the server version and the representation (the effective options and the caller's tier); for a body that moves within a cycle (the default nowcast-blended forecast, `/current`) also a digest of the content. Send it back as `If-None-Match` to get `304 Not Modified` while it is current; a weak `W/` form (Cloudflare weakens it when it compresses) matches too.
      schema:
        type: string
    CacheControl:
      description: |
        By caller class and layer. Anonymous: `public, max-age=0, s-maxage=N, stale-while-revalidate=M` -- the `nowcast=false` base forecast N = until the next expected model cycle (300..3600 s), M = 300; the default merged forecast N = 60, M = 30; `/current` N = 30, M = 15. Any API key or session: `private, max-age=0` (the body depends on the tier). `max-age=0` makes browsers revalidate with the `ETag` every time.
      schema:
        type: string
      example: public, max-age=0, s-maxage=3600, stale-while-revalidate=300
    Vary:
      description: |
        `Authorization, X-API-Key, Cookie` on a public response, so a cache that honours `Vary` never answers a credentialed request with it.
      schema:
        type: string
    ListCacheControl:
      description: |
        Anonymous `public, max-age=300, s-maxage=900, stale-while-revalidate=300` (the catalog changes on a reload, not per cycle); any API key or session `private, max-age=0`.
      schema:
        type: string
    RateLimitLimit:
      description: |
        The size of the budget this response is counted against --
        the token bucket's burst, or the daily quota when that is the
        tighter one, or the scrape throttle's burst while the caller is
        flagged. Data routes only; absent for exempt callers, and absent
        with the other RateLimit-* headers on a response a shared cache
        may store (`Cache-Control` `public` or `s-maxage`), because the
        edge would replay it to other callers. Present on `private` and
        `no-store` responses (every credentialed response, every 429).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left before the binding limit refuses (0 on a 429).
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the binding limit is whole again.
      schema:
        type: integer
    RateLimitPolicy:
      description: |
        The caller's budgets, draft-ietf-httpapi-ratelimit-headers style:
        the token bucket as `<burst>;w=<seconds to refill it>` and, when
        the class has one, the daily quota as `<per_day>;w=86400`, e.g.
        `60;w=60, 10000;w=86400`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    NotModified:
      description: |
        Not Modified: the request's `If-None-Match` names this representation's current `ETag`. No body; the `ETag` and `Cache-Control` are those a 200 would carry.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    RateLimited:
      description: |
        A per-class budget refused the request. `error` is
        `TOO_MANY_REQUESTS`; `message` names the limit:
        the token bucket (burst spent faster than the sustained rate
        refills), the UTC day's quota (resets 00:00 UTC), the hourly
        catalog-row budget that caps list paging and search depth, or the
        scrape throttle -- a caller reading too many distinct locations in
        an hour, or walking the catalog in sorted order, is slowed to a few
        requests a minute for an hour (never banned). Wait `Retry-After`
        seconds. Always `Cache-Control: no-store`: a refusal is never
        edge-cached.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          description: '`no-store`.'
          schema:
            type: string
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CanonicalRedirect:
      description: |
        The URL is not canonical; `Location` is. See
        "Canonical URLs". Cacheable (`public, max-age=3600`).
      headers:
        Location:
          description: The canonical URL (path and query).
          schema:
            type: string
          example: /api/v1/locations/or/mt-hood-meadows?max_hours=48&units=imperial
        Cache-Control:
          schema:
            type: string
          example: public, max-age=3600, s-maxage=3600
    BadRequest:
      description: |
        The request is malformed -- a query value of the wrong
        type (`max_hours=abc`), a bad path segment, or a query parameter
        the route does not know (`max_hour=48`; the message names it and
        lists the route's parameters). Unknown parameters are refused
        rather than ignored, so a typo fails loudly and junk parameters do
        not mint edge-cache keys. `error` is `BAD_REQUEST` (or a more
        specific code the operation documents).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: BAD_REQUEST
            message: 'unknown query parameter ''max_hour''; this route accepts: daily, elevations, exclude_sources,
              ...'
    ProRequired:
      description: |
        A Pro-only option (`models=true`, a pinned `run`, or the
        coordinate route itself) asked for by a caller whose tier is not
        Pro -- anonymous callers are Free. `error` is `PRO_REQUIRED`; drop
        the option for the Free forecast. It used to be ignored silently.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: PRO_REQUIRED
            message: '`models` requires a Pro subscription; authenticate with a Pro API key or session,
              or drop the parameter for the Free forecast'
    Timeout:
      description: |
        The request did not complete within the server's 30 s
        deadline. `error` is `TIMEOUT`; retry. (It was an empty `408`.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: TIMEOUT
            message: The request did not complete within 30 s; retry
    NotFound:
      description: |
        No route matches the path (a JSON body, `error`
        `NOT_FOUND`), or the operation's resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: No route for /api/v1/nope
    InvalidApiKey:
      description: |
        The request presented an `X-API-Key` that is not a valid,
        active key -- unknown, revoked, or owned by an account that is
        suspended or not yet verified. `error` is `INVALID_API_KEY`. The key
        is refused rather than served as anonymous Free, so a mistyped or
        rotated key fails loudly. Send no key at all for anonymous Free
        access. Always `Cache-Control: no-store`.
      headers:
        Cache-Control:
          description: '`no-store`.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_API_KEY
            message: The X-API-Key is not a valid, active API key. Check it, or send no key for anonymous
              Free access.
  schemas:
    ActiveAlert:
      type: object
      description: Compact active NWS alert (headline carries the user text).
      required:
      - id
      - event
      - severity
      - urgency
      - headline
      - expires
      properties:
        id:
          type: string
          description: NWS alert identifier (urn:oid:…).
        event:
          type: string
          example: Winter Storm Warning
        severity:
          type: string
          description: NWS severity (Extreme/Severe/Moderate/Minor/Unknown).
        urgency:
          type: string
        headline:
          type: string
        onset:
          type: string
          format: date-time
          description: Omitted when NWS supplies none.
        expires:
          type: string
          format: date-time
        ends:
          type: string
          format: date-time
          description: Omitted when NWS supplies none.
    ErrorResponse:
      type: object
      description: Standard error envelope for every non-2xx JSON response.
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: |
            The machine-readable code (an enum). Additive within
            v1: a new code may appear, so treat an unknown one as its HTTP
            status.
          enum:
          - AMBIGUOUS
          - APP_ATTEST_REJECTED
          - APP_ATTEST_UNAVAILABLE
          - BAD_REQUEST
          - CAPTCHA_FAILED
          - CONFLICT
          - DATABASE_ERROR
          - ELEVATION_REQUIRED
          - FEELS_LIKE_UNAVAILABLE
          - FORBIDDEN
          - FORECAST_UNAVAILABLE
          - GONE
          - INTERNAL_ERROR
          - INVALID_API_KEY
          - INVALID_CODE
          - INVALID_COORDINATES
          - INVALID_ELEVATION
          - INVALID_MAX_HOURS
          - INVALID_TRANSITION
          - LOCATION_NOT_FOUND
          - MFA_ENROLLMENT_UNAVAILABLE
          - MFA_NOT_CONFIGURED
          - MFA_REQUIRED
          - MODEL_RUN_NOT_FOUND
          - NOT_FOUND
          - OUTSIDE_COVERAGE
          - PRO_REQUIRED
          - REFUND_AUDIT_FAILED
          - TIMEOUT
          - TOO_MANY_REQUESTS
          - UNAUTHORIZED
          example: BAD_REQUEST
        message:
          type: string
          description: Human-readable detail.
          example: latitude 200 out of range; must be between -90 and 90
    UnitSystem:
      type: string
      enum:
      - metric
      - imperial
      - kelvin
      default: metric
      description: |
        Unit system for response values. `kelvin` returns metric units with
        Kelvin temperatures. Forecast/location endpoints also accept
        `unit_system=` as a query-param alias for `units=`.
    LocationRef:
      type: object
      description: |
        ONE location reference, the same wherever a place is
        named -- the forecast's and `/current`'s `location`, every list and
        `/nearby` row, search hits and favorites. It replaced the forecast's
        `LocationInfo` (`name` = display name, `elevation` in the caller's
        units), the list row's `name` = slug / `display_name`, search's
        `types[]`, and the `elevation`/`elevation_m` spellings.
      required:
      - slug
      - state
      - name
      - lat
      - lon
      - elevation_m
      - type
      - timezone
      properties:
        slug:
          type: string
          description: |
            The location's key: its catalog slug. With `state`, the URL `/api/v1/locations/{state}/{slug}`; what a favorite stores.
          example: mt-hood-meadows
        state:
          type: string
          description: The lowercase USPS state code.
          example: or
        name:
          type: string
          description: The display name.
          example: Mt Hood Meadows
        lat:
          type: number
          example: 45.3356
        lon:
          type: number
          example: -121.6644
        elevation_m:
          type: number
          description: Elevation in metres, whatever `units` is (0.1 m).
          example: 1635.6
        type:
          type: string
          description: The primary location type, snake_case.
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
          example: ski_area
        timezone:
          type: string
          description: |
            The IANA zone the location's local days and hours are kept in -- the zone `daily` dates, sunrise and sunset are computed in. Label the hourly series in it (/1080).
          example: America/Los_Angeles
    CurrentResponse:
      type: object
      required:
      - location
      - alerts
      - alerts_as_of
      - sensors
      - sensor_count
      - as_of
      - model_run_initialized_at
      - nowcast_hours
      - current
      - units
      - attribution
      properties:
        location:
          allOf:
          - $ref: '#/components/schemas/LocationRef'
          description: |
            The one location reference (it was the display name beside flat `lat`, `lon`, `elevation_m` and `timezone`).
        alerts:
          type: array
          description: |
            Active NWS watches/warnings/advisories for this location (zone- and polygon-matched). Rides the fresh /current lane deliberately — the cacheable forecast body never carries alerts.
          items:
            $ref: '#/components/schemas/ActiveAlert'
        alerts_as_of:
          type: string
          format: date-time
          description: |
            Timestamp of the alerts snapshot backing this response (refreshed ~60s; staleness beyond a few minutes means the alerts pipeline is degraded).
        sensor_count:
          type: integer
        sensors:
          type: array
          description: |
            Each sensor's latest reading set (in the request's `units`, under plain names -- it was the observation table's column names and units, `temperature_c`, `wind_speed_ms`). A reading is omitted where the sensor does not take it, and where verification does not take it as truth at that station (the one rule that also governs scoring and training): HADS river-gauge temperature and dewpoint and CWOP backyard-station dewpoint and wind. A sensor left with no reading at all is not listed, and is neither counted in `sensor_count` nor credited in `attribution`.
          items:
            $ref: '#/components/schemas/SensorObservation'
        current:
          description: |
            "Right now" flattened: the `nowcast_hours` hour nearest the request time, read field by field (see the schema). Null when no cycle is servable or no band hour lies within an hour of now.
          anyOf:
          - $ref: '#/components/schemas/CurrentConditions'
          - type: 'null'
        as_of:
          type: string
          format: date-time
          description: |
            When this overlay was assembled (the request time); the `nowcast_hours` window is relative to it.
        model_run_initialized_at:
          description: |
            The reference init of the cycle the band was read from (null when no cycle is servable). A change means the cached base forecast is from an older cycle.
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        nowcast_hours:
          description: |
            The obs-blended forecast hours with valid times in [as_of − 1 h, as_of + 10 h], shaped like the forecast's `timeseries` points; null when no cycle is servable. Present only with `?include=nowcast_hours` (it was 42 KB of a 44 KB body on a 30 s TTL); `current` is the flat "right now".
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/TimeSeriesPoint'
          - type: 'null'
        units:
          $ref: '#/components/schemas/UnitSystem'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
        nowcast_unavailable:
          type: array
          items:
            type: string
            enum:
            - observation
            - radar
            - cloud
            - nearest_sensors
          description: |
            The live nowcast sources `nowcast_hours` and `current` were built without because their read did not answer in time (or failed). A request never waits on a slow observation read past a short deadline; it serves without that source and names it here. Omitted when every source was read.
    AlertsResponse:
      type: object
      required:
      - location
      - alerts
      - alert_count
      - as_of
      - attribution
      properties:
        location:
          allOf:
          - $ref: '#/components/schemas/LocationRef'
          description: The one location reference (it was the display name).
        alert_count:
          type: integer
        as_of:
          type: string
          format: date-time
          description: Snapshot timestamp (see /current alerts_as_of).
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ActiveAlert'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
    SearchLocationsResponse:
      type: object
      required:
      - items
      - count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        count:
          type: integer
    PublicCatalogLocationPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCatalogLocation'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `?cursor=` for the next page; null at the end.
    PublicCatalogStationPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCatalogStation'
        next_cursor:
          type:
          - string
          - 'null'
    RunsResponse:
      type: object
      required:
      - served
      - runs
      - count
      properties:
        served:
          description: |
            What a forecast request serves now; `null` when no cycle is servable.
          anyOf:
          - type: object
            required:
            - initialized_at
            - models
            properties:
              initialized_at:
                type: string
                format: date-time
                description: |
                  The reference init: the newest contributing cycle, a forecast's `model_run.initialized_at`.
              models:
                type: array
                description: |
                  Each contributing model and its own cycle (`{id, cycle}`), as `model_run.models`.
                items:
                  $ref: '#/components/schemas/ModelEntry'
          - type: 'null'
        runs:
          type: array
          description: |
            Init times at least two models completed, newest first (it was `available_runs`, bare strings).
          items:
            type: object
            required:
            - initialized_at
            properties:
              initialized_at:
                type: string
                format: date-time
        count:
          type: integer
    StormReportsResponse:
      type: object
      required:
      - reports
      - count
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/StormReportCard'
        count:
          type: integer
    NearbyPointResponse:
      type: object
      required:
      - lat
      - lon
      - radius_km
      - count
      - locations
      properties:
        lat:
          type: number
        lon:
          type: number
        radius_km:
          type: number
        count:
          type: integer
        locations:
          type: array
          items:
            $ref: '#/components/schemas/NearbyLocation'
    LocationsResponse:
      type: object
      required:
      - state
      - count
      - locations
      properties:
        state:
          type: string
          description: |
            Display label for the scope: `Oregon`, `Washington`, `California` for a single-state query, or `all` when hitting `/api/v1/locations`.
          example: Oregon
        count:
          type: integer
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'
        next_cursor:
          type: string
          description: |
            Present only on a paged response (`limit` given) that
            has more rows after it. Pass it back as `cursor`.
    NearbyLocationsResponse:
      type: object
      required:
      - location
      - radius_km
      - count
      - locations
      properties:
        location:
          $ref: '#/components/schemas/LocationSummary'
        radius_km:
          type: number
          description: The radius applied, after the cap.
        count:
          type: integer
          description: Neighbours in this response (the location itself is not counted).
        locations:
          type: array
          description: Nearest first.
          items:
            $ref: '#/components/schemas/NearbyLocation'
    NearbyLocation:
      allOf:
      - $ref: '#/components/schemas/LocationSummary'
      - type: object
        required:
        - distance_km
        properties:
          distance_km:
            type: number
            description: Great-circle distance from the location, km.
    LocationSummary:
      type: object
      description: |
        A list, `/nearby` or favorite row: the [`LocationRef`] fields
        plus the county, the catalog blurb and the
        location's named elevations.
      required:
      - slug
      - state
      - name
      - lat
      - lon
      - elevation_m
      - type
      - timezone
      - county
      properties:
        slug:
          type: string
          description: |
            The location's key: its catalog slug. With `state`, the URL `/api/v1/locations/{state}/{slug}`; what a favorite stores.
          example: mt-hood-meadows
        state:
          type: string
          description: The lowercase USPS state code.
          example: or
        name:
          type: string
          description: The display name.
          example: Mt Hood Meadows
        lat:
          type: number
          example: 45.3356
        lon:
          type: number
          example: -121.6644
        elevation_m:
          type: number
          description: Elevation in metres, whatever `units` is (0.1 m).
          example: 1635.6
        type:
          type: string
          description: The primary location type, snake_case.
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
          example: ski_area
        timezone:
          type: string
          description: |
            The IANA zone the location's local days and hours are kept in -- the zone `daily` dates, sunrise and sunset are computed in. Label the hourly series in it (/1080).
          example: America/Los_Angeles
        county:
          type: string
          description: Administrative county.
          example: Hood River
        description:
          type:
          - string
          - 'null'
          description: Free-text blurb from the catalog (when present).
        elevations:
          type: array
          description: |
            The location's elevation points (e.g., ski area base / mid /
            summit), the primary first. Exactly one entry is
            `default: true` -- the primary, the elevation the forecast is
            served at -- and it is listed once: when a named point sits at
            the primary's elevation the primary carries that name
            (`main_lodge`) instead of `default`. Every other entry omits
            `default`. Omitted when empty.
          items:
            type: object
            required:
            - name
            - elevation
            properties:
              name:
                type: string
              elevation:
                type: number
                description: In the caller's length units (m, ft), to 0.1.
              default:
                type: boolean
                description: Present (true) on the primary only.
    ProbabilityResult:
      type: object
      description: -- one `?prob=` term, answered.
      required:
      - variable
      - op
      - threshold
      - window_start_hours
      - window_end_hours
      - aggregation
      - from
      - to
      - probability
      - members
      properties:
        variable:
          type: string
          enum:
          - precipitation
          - snow_level
          - snowfall
          - temperature
          - wind_speed
        op:
          type: string
          enum:
          - ge
          - le
        threshold:
          type: number
          description: In the request's units, at the variable's served precision.
        window_start_hours:
          type: integer
        window_end_hours:
          type: integer
        aggregation:
          type: string
          enum:
          - total
          - any
          - all
        from:
          type:
          - string
          - 'null'
          format: date-time
          description: The window's first instant.
        to:
          type:
          - string
          - 'null'
          format: date-time
          description: The window's end (exclusive).
        probability:
          type:
          - number
          - 'null'
          description: |
            The share of members meeting the term, 0..1 (0.001); `null` when the served series does not reach the window's end or carries no members (`hourly=false`).
        members:
          type: integer
          description: |
            Members that voted: for `total`, the members whose values cover the whole window; for `any`/`all`, those with a value in it.
    WindowTotal:
      type: object
      description: -- one `?totals=` window, across the members.
      required:
      - variable
      - window_start_hours
      - window_end_hours
      - from
      - to
      - quantiles
      - members
      properties:
        variable:
          type: string
          enum:
          - precipitation
          - snowfall
        window_start_hours:
          type: integer
        window_end_hours:
          type: integer
        from:
          type:
          - string
          - 'null'
          format: date-time
        to:
          type:
          - string
          - 'null'
          format: date-time
        quantiles:
          description: |
            The members' window totals, counted as the headline counts its windows (a straddling bucket by its share inside; only members covering the whole window); `null` when the window is not covered or fewer than two members cover it.
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        members:
          type: integer
    Quantiles:
      type: object
      description: |
        THE distribution shape -- every ensemble statistic the
        API serves (hourly `ensemble.*`, per-model `model_means[].*`, the
        daily `high`/`low`/`total_*`/`feels_like_*`, the plume's
        `members_cumulative`, `?totals=` windows, `snow_outlook.quantiles`
        windows, the daily `snow_level` and `*_if_wet`) is this one object, in
        the request's units. It replaces
        `StatValues` (whose `spread` is gone: it was `max - min`),
        `DailyStat` (which had no `p10`/`p90`) and `CumulativeStats` (whose
        `members` count is gone: count the members you draw). Percentiles
        are over the ensemble members (Hyndman-Fan type 7 where computed
        from members). `min`/`max` are present where the statistic has them
        (everywhere but the daily `snow_level` and `*_if_wet`).
      required:
      - mean
      - p10
      - p25
      - p50
      - p75
      - p90
      properties:
        mean:
          type: number
          description: Ensemble mean. For right-skewed, zero-inflated variables (precipitation, snowfall)
            the mean is inflated by upper-tail members and over-predicts at a point -- it is the verification/scorecard
            number, NOT the headline. Prefer `p50` for the displayed amount.
        p10:
          type: number
          description: 10th percentile (realistic lower bound for visualization).
        p25:
          type: number
        p50:
          type: number
          description: Ensemble median -- the headline-appropriate amount for skewed precipitation (half
            the members above, half below). Pair with `probability` for occurrence, since the median can
            be 0 on scattered-shower days while precip is still likely.
        p75:
          type: number
        p90:
          type: number
          description: 90th percentile (realistic upper bound for visualization).
        min:
          type: number
          description: p0 (ensemble minimum -- absolute extreme, often an outlier). For the CIRCULAR variable
            `wind_direction` this is the anticlockwise END of an arc and may be numerically greater than
            `max` (read `wind_direction_circular`).
        max:
          type: number
          description: p100 (ensemble maximum -- absolute extreme, often an outlier). For `wind_direction`
            this is the clockwise END of an arc and may be numerically less than `min`.
        probability:
          type: number
          description: 'Only on the hourly `precipitation` and `snowfall`: the probability of occurrence,
            P(amount >= 0.1 mm trace), with the rain-icon false-alarm gate applied so it agrees with the
            hour''s `condition`/icon. Omitted everywhere else.'
    PrecipDisplay:
      type: object
      description: |
        A day's precipitation headline, chosen by the server so
        every client says the same thing: `kind` `none` when the chance of a
        wet day (`precip_occurrence_probability`) is under 15 %, else the
        day's `precip_type`; `chance` that chance; `amount` the median
        amount if wet (`total_snowfall_if_wet.p50` for snow,
        `total_precip_if_wet.p50` otherwise).
      required:
      - kind
      - chance
      properties:
        kind:
          type: string
          enum:
          - none
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
        chance:
          type: number
        amount:
          type: number
    ProbabilityThresholds:
      type: object
      description: |
        The event behind each served probability, in the request's
        units, so no client hard-codes them: P(amount >= the threshold).
      required:
      - hourly_precipitation
      - hourly_snowfall
      - daily_precip_probability
      - daily_precip_occurrence_probability
      - daily_snow_probability
      properties:
        hourly_precipitation:
          type: number
          description: '`ensemble.precipitation.probability`''s threshold (0.254 mm).'
        hourly_snowfall:
          type: number
          description: '`ensemble.snowfall.probability`''s threshold (0.254 mm).'
        daily_precip_probability:
          type: number
          description: '`daily[].precip_probability`''s day-total threshold (2.5 mm).'
        daily_precip_occurrence_probability:
          type: number
          description: '`daily[].precip_occurrence_probability`''s threshold (1.0 mm), also the "if wet"
            condition.'
        daily_snow_probability:
          type: number
          description: '`daily[].snow_probability`''s day-snowfall threshold (2.5 mm).'
    AppliedOptions:
      type: object
      description: |
        The forecast options the server applied, after the
        tier clamps and bounds. `max_hours` and `max_days` are clamped, never
        refused (Free 240 h / 10 days, Pro 360 h / 15 days; `max_hours` has
        a 6 h floor), so the body says what it served. Present on every
        REST forecast body.
      required:
      - max_hours
      - max_days
      - clamped
      properties:
        max_hours:
          type:
          - integer
          - 'null'
          description: Hours past the first served hour; `null` with `hourly=false`.
          example: 240
        max_days:
          type:
          - integer
          - 'null'
          description: Daily rows served for; `null` with `daily=false`.
          example: 10
        clamped:
          type: array
          items:
            type: string
            enum:
            - max_hours
            - max_days
          description: |
            The requested options the server changed, in this order. Empty
            when it changed none.
          example:
          - max_hours
    ForecastResponse:
      type: object
      required:
      - location
      - model_run
      - units
      - forecast
      - nowcast_applied
      - attribution
      properties:
        thresholds:
          $ref: '#/components/schemas/ProbabilityThresholds'
        probabilities:
          type: array
          description: -- the `?prob=` terms, answered (omitted when none were asked).
          items:
            $ref: '#/components/schemas/ProbabilityResult'
        window_totals:
          type: array
          description: -- the `?totals=` windows (omitted when none were asked).
          items:
            $ref: '#/components/schemas/WindowTotal'
        applied:
          $ref: '#/components/schemas/AppliedOptions'
        location:
          $ref: '#/components/schemas/LocationRef'
        model_run:
          $ref: '#/components/schemas/ModelRunInfo'
        units:
          allOf:
          - $ref: '#/components/schemas/UnitSystem'
          description: |
            The unit system every value in this body is
            in -- the request's `units=` (or its alias `unit_system=`),
            `metric` when neither is given. Always present, so a cached or
            shared body says whether `32.0` is °F or °C. The Cap'n Proto
            body carries the same as `ForecastResponse.units` (set when
            `hasUnits`).
        forecast:
          $ref: '#/components/schemas/ForecastData'
        elevation_forecasts:
          type: array
          items:
            $ref: '#/components/schemas/ElevationForecast'
        nowcast_applied:
          type: boolean
          description: |
            Whether the live nowcast layer is baked in. `true` = merged legacy shape (uncacheable). `false` = pure Layer-A base forecast (edge-cacheable; overlay `…/current`'s `nowcast_hours` on top).
        nowcast_unavailable:
          type: array
          items:
            type: string
            enum:
            - observation
            - radar
            - cloud
            - nearest_sensors
          description: |
            The live nowcast sources this body was built WITHOUT because their read did not answer in time (or failed): the nearest station's reading (`observation`), MRMS `radar`, GOES `cloud`, or the `nearest_sensors` list. A forecast request never waits on a slow observation read past a short deadline (250 ms for the radar and cloud grids, 1 s for a location's first station read); it serves the forecast without that source and names it here. Omitted when every source was read, and on `nowcast=false`.
        members_view:
          type: string
          enum:
          - plume
          - full
          description: |
            Which member view `forecast.timeseries[*].members` (and `elevation_forecasts[*].hourly[*].members`) carries; present exactly when members are. `plume` (Free) withholds `wind_speed`, `wind_direction` and `slr` — a `null` there is withheld by the view, not a member that published nothing. `full` (Pro) carries every member variable.
        gap_flow:
          type:
          - object
          - 'null'
          description: Columbia Gorge gap flow status at the first served hour, from the forecast mean-sea-level-pressure
            difference across the Gorge (The Dalles minus Portland, each model differenced on its own,
            then averaged). Only present for locations within the Gorge corridor and when the forecast
            carries MSLP at both ends. Omitted for nowcast=false.
          properties:
            status:
              type: string
              enum:
              - none
              - moderate
              - strong
              - extreme
            pressure_diff_hpa:
              type: number
            wind_multiplier:
              type: number
            direction:
              type: string
        nearest_sensors:
          type: array
          description: |
            Nearby observation sensors ranked by an elevation-weighted
            distance. `effective_distance_km` combines horizontal distance
            with a 100 m / 1 km elevation penalty — a sensor 200 m below
            the forecast point effectively moves 2 km further away in the
            ranking. Typically top 5 returned. Empty when no sensor
            reported within 50 km / 3 hours.
          items:
            $ref: '#/components/schemas/NearestSensor'
        point:
          $ref: '#/components/schemas/PointInfo'
        current:
          $ref: '#/components/schemas/CurrentConditions'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
    ResponseAttribution:
      type: object
      description: |
        The data sources THIS response drew on, and what their
        licences ask us to say. `sources` names exactly the contributors:
        the blend's models that moved a served number (a model read but
        pooled at zero weight is absent), the climatology behind the daily
        normal (`era5`, `snotel`), PRISM where a precipitation-elevation
        carry was applied, the DEM for a coordinate forecast whose elevation
        came from it (`usgs_3dep`), and the observation networks of the
        nowcast and the nearest sensors. `credit` is one line per provider
        (ECMWF-derived output says it was modified, as its CC BY 4.0 terms
        require); carry it with any redistributed output. The full notices
        are at `url`.
      required:
      - sources
      - credit
      - url
      properties:
        sources:
          type: array
          items:
            type: string
          description: Source ids from `GET /api/v1/attribution`, in registry order.
          example:
          - aifs
          - gefs
          - ifs_ens
          - era5
        credit:
          type: string
          example: 'Contains modified ECMWF data: based on data and products of the European Centre for
            Medium-Range Weather Forecasts (ECMWF), CC BY 4.0; NOAA/NWS data (public domain), modified
            by Ourea; Contains modified Copernicus Climate Change Service information 2026'
        url:
          type: string
          description: Path of the full registry.
          example: /api/v1/attribution
    AttributionRegistry:
      type: object
      required:
      - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AttributionProvider'
    AttributionProvider:
      type: object
      required:
      - id
      - name
      - credit
      - licence
      - licence_url
      - terms_url
      - modified
      - notices
      - sources
      properties:
        id:
          type: string
          example: ecmwf
        name:
          type: string
        credit:
          type: string
          description: The credit line a response carries for this provider.
        licence:
          type: string
          description: |
            SPDX id where one exists (`CC-BY-4.0`, `CC-BY-3.0`, `ODbL-1.0`); otherwise `public-domain-us-gov`, `public-domain`, `none-stated`, or the name of the provider's own terms.
        licence_url:
          type: string
        terms_url:
          type: string
          description: The page the wording was taken from.
        modified:
          type: boolean
          description: Ourea serves this provider's data modified and its terms ask that this be said.
        notices:
          type: array
          items:
            type: string
          description: Statements the terms require shown in full, beyond `credit`.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AttributionSource'
    AttributionSource:
      type: object
      required:
      - id
      - name
      - kind
      - provider
      properties:
        id:
          type: string
          example: aifs
        name:
          type: string
        kind:
          type: string
          enum:
          - model
          - peer
          - observation
          - alerts
          - climatology
          - terrain
          - places
          - basemap
        provider:
          type: string
    SensorObservation:
      type: object
      description: |
        One `/current` sensor -- its latest readings, in the
        request's `units` (the Cap'n Proto `SensorObservation` carries the
        same values). A reading the sensor does not take is omitted.
      required:
      - station_id
      - name
      - source
      - observation_time
      properties:
        station_id:
          type: string
          description: The station's id in its network.
          example: KPDX
        name:
          type: string
          description: The station's registry name, else its id.
          example: Portland International Airport
        source:
          type: string
          example: nws
        observation_time:
          type: string
          format: date-time
        temperature:
          type: number
          description: °C, °F (imperial) or K (kelvin).
        dewpoint:
          type: number
          description: As `temperature`.
        relative_humidity:
          type: number
          description: Percent.
        wind_speed:
          type: number
          description: m/s or mph (imperial).
        wind_gust:
          type: number
          description: As `wind_speed`.
        wind_direction:
          type: number
          description: Degrees clockwise from north.
        pressure:
          type: number
          description: 'Station pressure: hPa, or inHg (imperial).'
        precipitation:
          type: number
          description: 'The last reporting period''s precipitation: mm, or in (imperial).'
        precip_rate:
          type: number
          description: 'Radar precipitation rate: mm/h, or in/h (imperial).'
        reflectivity:
          type: number
          description: Radar reflectivity, dBZ.
        pavement_temp:
          type: number
          description: As `temperature`.
        subsurface_temp:
          type: number
          description: As `temperature`.
        visibility:
          type: number
          description: m, or ft (imperial).
        cloud_cover:
          type: number
          description: Percent.
        ceiling_height:
          type: number
          description: m, or ft (imperial).
        snow_depth:
          type: number
          description: cm, or in (imperial).
        swe:
          type: number
          description: 'Snow water equivalent: mm, or in (imperial).'
        swe_percent_of_median:
          type: number
          description: SWE as a percent of the station's median for the date.
        snowfall:
          type: number
          description: mm, or in (imperial).
        solar_radiation:
          type: number
          description: W/m².
        pavement_condition:
          type: string
          description: Road-weather pavement state as the network reports it.
    CurrentConditions:
      type: object
      description: |
        "Right now" as one flat object: a view of ONE served hourly point,
        never a second forecast. `time` names the hour (the served hour
        nearest the request time, within one hour of it — the window in
        which the nowcast blend's time taper is at full weight); every value is
        copied from that hour, in the request's `units`:

        | field | source |
        |---|---|
        | `temperature` | `ensemble.temperature.mean` |
        | `feels_like` | `ensemble.feels_like.mean` |
        | `condition`, `condition_text`, `condition_icon` | the hour's `condition`, `condition_text`, `condition_icon` |
        | `wind_speed` | `ensemble.wind_speed.mean` |
        | `wind_gust` | `ensemble.wind_gust.mean` |
        | `wind_direction` | `ensemble.wind_direction.mean` (circular mean) |
        | `relative_humidity` | `ensemble.relative_humidity.mean` |

        The fields are named as the forecast's ensemble
        variables are (`wind.speed` -> `wind_speed`, `wind.gust` ->
        `wind_gust`, `wind.direction` -> `wind_direction`, `humidity` ->
        `relative_humidity`), and `condition` is the stable code.
        | `dewpoint` | `ensemble.dewpoint.mean` |
        | `precip_probability` | `ensemble.precipitation.probability` |

        Why the mean: the nowcast blend shifts each distribution's MEAN by
        a share of the latest admissible surface observation's error against
        the forecast at the time it was read (nearest elevation-gated
        station), so for "right now" the mean is the observation-anchored
        number: the reading's correction, carried to the hour along the
        forecast's own trend. The share is the reading's age weight times,
        for temperature, dewpoint and wind speed, its precision weight against
        the forecast — `σF² / (σF² + σo²)`, with `σo` the reading's error at the
        point, which grows with its distance and elevation difference
        (temperature) — so a close sensor moves the hour most of the way and a
        distant or much higher one only a little. The gust moves with the
        wind speed, by the same amount. The median sits off the mean by the
        model spread's skew. Optional fields are omitted when the hour does
        not serve their source — never zero-filled.

        Present on the nowcast layer only (`…/current`, and the forecast
        endpoints with `nowcast=true`); absent when no served hour lies
        within an hour of now (e.g. a pinned old `run`).
      required:
      - time
      - temperature
      - condition
      - condition_text
      - condition_icon
      - wind_speed
      - wind_direction
      - source
      properties:
        time:
          type: string
          format: date-time
          description: '`valid_time` of the hour the block is read from.'
        temperature:
          type: number
          description: °C (metric), °F (imperial), K (kelvin).
        feels_like:
          type: number
          description: Same unit as `temperature`.
        condition:
          type: string
          description: |
            The hour's stable condition code, as `TimeSeriesPoint.condition` (`partly_cloudy`). Treat unknown codes as additive.
          example: partly_cloudy
        condition_text:
          type: string
          description: The display text for `condition`, as `TimeSeriesPoint.condition_text`.
          example: Partly Cloudy
        condition_icon:
          type: string
          example: partly_cloudy
        wind_speed:
          type: number
          description: m/s (metric, kelvin) or mph (imperial).
        wind_gust:
          type: number
          description: Same unit as `wind_speed`. Omitted where the hour serves no gust.
        wind_direction:
          type: number
          description: Degrees clockwise from north, direction the wind blows FROM.
        relative_humidity:
          type: number
          description: Relative humidity, percent (0–100).
        dewpoint:
          type: number
          description: Same unit as `temperature`.
        precip_probability:
          type: number
          description: Probability (0–1) of at least a 0.1 mm trace in the hour.
        source:
          type: string
          enum:
          - nowcast
          - model
          description: |
            `nowcast` — at least one live observation (surface station,
            MRMS radar, GOES cloud mask) carried weight at this hour.
            `model` — none did; the hour is the calibrated forecast alone.
        station:
          type: object
          description: |
            The surface station whose reading anchored temperature, dewpoint and wind at this hour. Omitted when none did.
          required:
          - name
          - observation_time
          properties:
            name:
              type: string
              example: KPDX
            observation_time:
              type: string
              format: date-time
    PointInfo:
      type: object
      description: |
        Where a coordinate forecast (`GET /api/v1/forecast`) was
        computed. Present only on that endpoint.
      required:
      - requested_lat
      - requested_lon
      - lat
      - lon
      - resolution_deg
      - elevation
      - elevation_source
      - state
      properties:
        requested_lat:
          type: number
          description: Latitude as sent.
        requested_lon:
          type: number
          description: Longitude as sent.
        lat:
          type: number
          description: The quantized latitude the forecast was computed at.
        lon:
          type: number
          description: The quantized longitude the forecast was computed at.
        resolution_deg:
          type: number
          description: Quantization step in degrees (0.01).
        elevation:
          type: number
          description: |
            Elevation the forecast was computed at, in the response's length unit (m; ft for `units=imperial`), like `location.elevation`.
        elevation_source:
          type: string
          enum:
          - request
          - dem_3dep_10m
          description: |
            `request` = the caller's `elevation_m` (it always wins); `dem_3dep_10m` = no `elevation_m` was sent, and this is the USGS 3DEP 1/3 arc-second (~10 m) DEM, bilinear at the quantized point.
        state:
          type: string
          description: USPS code of the state the point is in (sets the daily summaries' timezone).
          example: OR
    NearestSensor:
      type: object
      required:
      - station_id
      - name
      - source
      - distance_km
      - elevation_diff
      - effective_distance_km
      - observation_time
      properties:
        station_id:
          type: string
          description: -- the station's id in its network.
          example: 651:OR:SNTL
        name:
          type: string
          description: |
            -- the station's name from the stations registry, else its id (it was one `station_name` holding the id).
          example: Mt Hood Test Site
        source:
          type: string
          description: Observation network (snotel, nws, raws, rwis, cdec, tempest, etc.)
          example: snotel
        distance_km:
          type: number
          format: double
          description: Straight-line surface distance in km.
          example: 2.41
        elevation_diff:
          type: number
          format: double
          description: |
            Sensor elevation minus forecast-location elevation, in the
            caller's length units (m metric, ft imperial). Positive if
            the sensor sits above the forecast point.
          example: -120.0
        effective_distance_km:
          type: number
          format: double
          description: |
            `distance_km + |elevation_diff_m| / 100`. Lower ranks closer.
          example: 3.61
        observation_time:
          type: string
          format: date-time
    ModelRunInfo:
      type: object
      description: |
        The composition the forecast was blended from. The blend is
        per-model-latest: every model contributes its freshest
        complete cycle within its staleness cap (aifs/aigefs/gefs 30 h,
        ifs_ens 36 h, rrfs 14 h), aligned by VALID time, so the models are
        generally at DIFFERENT inits — `models[].cycle` names each one's.
      required:
      - initialized_at
      - total_members
      - models
      properties:
        initialized_at:
          type: string
          format: date-time
          description: |
            The reference init: the NEWEST contributing model's cycle.
            Every `lead_time_hours` in the response counts from it; a model
            whose cycle is older contributes its own lead
            `lead_time_hours + (initialized_at − models[].cycle)`. For
            `?run=` (a pinned historical cycle) every model is at this init.
        total_members:
          type: integer
        models:
          type: array
          description: |
            One entry per contributing model, in the order
            `aifs`, `aigefs`, `gefs`, `ifs_ens`, `rrfs` (a model added later
            follows, by id). It replaces `aifs_members`..`rrfs_members`, the
            `source_models` CSV and the `model_cycles` map: a new model is a
            new element, never a new key. A model that contributed nothing
            is absent.
          items:
            $ref: '#/components/schemas/ModelEntry'
    ModelEntry:
      type: object
      description: One contributing model.
      required:
      - id
      properties:
        id:
          type: string
          description: The model id (`aifs`, `aigefs`, `gefs`, `ifs_ens`, `rrfs`; treat others as additive).
          example: gefs
        cycle:
          type: string
          format: date-time
          description: The model's own cycle init (per-model-latest). Omitted when it was not read.
        members:
          type: integer
          description: How many of its members the forecast carries (in `model_run`); omitted in `/runs`
            `served`.
    ForecastData:
      type: object
      required:
      - max_hours
      - interval_hours
      properties:
        max_hours:
          type: integer
          description: |
            The last served hour, in hours from the FIRST served one (the current hour by default, the run's init with `include_past=true` or a pinned `run`) -- the request's `max_hours` clamped to the tier, less when the run ends first. `0` with `hourly=false`, which serves no hour.
        interval_hours:
          type: integer
        timeseries:
          type: array
          description: |
            Omitted with `hourly=false`. Starts at the hour containing the request time (`floor(now)`; 23:00Z for a 23:23Z request against the 18Z run) and runs `max_hours` past it; with `include_past=true` or a pinned `run`, at the run's init. `lead_time_hours` counts from `model_run.initialized_at` either way. Hourly points, ascending by `valid_time`. **Not guaranteed contiguous.** `temperature`, `precipitation`, `wind_speed` and `wind_direction` are non-nullable on a `TimeSeriesPoint` because the blend always produces them; an hour where it did not is OMITTED from this array rather than served with fabricated zeros. That is a system failure on our side, it is alarmed on, and it is expected to be vanishingly rare — but a client must key on `valid_time` / `lead_time_hours` and must not assume `timeseries[i]` is `i` hours after `timeseries[0]`. The same hours are absent from `daily` (their day totals sum only the hours present, exactly as the first and last day of any forecast already do) and from `elevation_forecasts[].timeseries`.
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailyForecast'
        snow_outlook:
          anyOf:
          - $ref: '#/components/schemas/SnowOutlook'
          - type: 'null'
          description: |
            Rolling snow-accumulation summary for common UI windows. Always forward-looking (next N hours / days), summed from the same corrected hourly series as `daily` and `timeseries` — exposed here so clients don't each re-implement the same rolling sums. Like `daily`, it does not depend on `max_hours` or `hourly`: the windows are read from the forecast, not from the served hours. Its windows open at the first served hour -- the current hour by default, the run's init with `include_past=true` -- with `hourly=false` too. Present exactly when `daily` is.
    SnowOutlook:
      type: object
      description: |
        Snow accumulation totals for common UI windows. Values follow the request's `units` param (mm metric, inches imperial). Every total is the sum of the hourly snowfall MEANS over its window (changed 2026-09-24 from summed medians): the mean is the only statistic that adds across hours, and it is what every client sums, so `next_24h` equals the sum of `timeseries[0..24]` snowfall means. Pair with `daily[].snow_probability` for occurrence. The windows open at the first served hour and are read from the forecast whatever `max_hours` or `max_days` is. A window the forecast does not reach (the model run ends before it closes) is `null` -- never the shorter sum of the hours there are, which was served as the whole window.
      required:
      - next_24h
      - next_48h
      - next_7d
      properties:
        next_24h:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the 24 h from the first served hour; `null` when the forecast does not reach its end.
        next_48h:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the first 48 h; `null` when not covered.
        next_7d:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the first 168 h; `null` when not covered.
        overnight_4pm_9am:
          type:
          - number
          - 'null'
          description: |
            Snow expected overnight, local 16:00 today → 09:00 tomorrow: the sum of the hourly snowfall means in the window, read from the forecast whatever `max_hours` is. Null when the window isn't covered by the model run, with `nowcast=false` (it is wall-clock-anchored), and null when any hour inside the window was refused — a fixed window summed across a gap under-counts by exactly the missing hours while still looking complete, so the headline is withheld instead.
        quantiles:
          $ref: '#/components/schemas/SnowOutlookQuantiles'
    SnowOutlookQuantiles:
      type: object
      description: |
        The RANGE of each `snow_outlook` window's snowfall total, on the default response (no `members` needed) and on every `elevation_forecasts[].snow_outlook`. The percentiles are those of every member's OWN total over the window -- the same hours the headline sums (valid times in [first served hour, + N h), each covering the hour ending at it; a 6-hourly bucket straddling an end counts its share inside) -- never a sum of hourly percentiles (quantiles are not additive). Members are pooled across models, one vote each, and a member counts only when its values cover the WHOLE window (a model whose run ends inside it is left out). `mean` is the window's headline total (`next_24h`...). Show it as "most likely `p50`, at least `p10`, could reach `p90`". A window is null when fewer than two members cover it; the object is omitted when every window is null.
      properties:
        next_24h:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        next_48h:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        next_7d:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
    TimeSeriesPoint:
      type: object
      required:
      - valid_time
      - lead_time_hours
      - is_night
      - condition
      - condition_text
      - condition_icon
      - ensemble
      properties:
        valid_time:
          type: string
          format: date-time
        lead_time_hours:
          type: integer
        is_night:
          type: boolean
          description: Whether this hour is nighttime at the forecast location
        condition:
          type: string
          description: |
            A stable machine code to switch on -- the display text (`condition_text`) lowercased, each run of other characters one `_` (`partly_cloudy`, `rain_snow_mix_likely`). It was the display text. Treat unknown codes as additive.
          enum:
          - sunny
          - mostly_sunny
          - partly_cloudy
          - mostly_cloudy
          - cloudy
          - clear
          - mostly_clear
          - slight_chance_showers
          - chance_showers
          - showers_likely
          - rain
          - light_rain
          - heavy_rain
          - slight_chance_rain_snow_mix
          - chance_rain_snow_mix
          - rain_snow_mix_likely
          - rain_snow_mix
          - slight_chance_snow
          - chance_snow
          - snow_likely
          - snow
          - slight_chance_freezing_rain
          - chance_freezing_rain
          - freezing_rain_likely
          - freezing_rain
          example: partly_cloudy
        condition_text:
          type: string
          description: |
            Human-readable weather condition for the hour, day/night aware.
            One rule shared with the daily `condition`: a SKY class
            crossed with a PRECIPITATION tier.

            **Sky** (no precipitation expected): the most likely of five
            classes of this hour's served cloud-cover distribution — Sunny /
            Clear (< 20%), Mostly Sunny / Mostly Clear (20-40), Partly Cloudy
            (40-60), Mostly Cloudy (60-80), Cloudy (>= 80) — read off the
            published percentile ladder, coarse side first (`P(< 40%)`,
            `P(40-80%)`, `P(>= 80%)`, every edge and any tie going to the
            cloudier class) and then the half of that side. Not a
            threshold on `cloud_cover`'s mean: cloud cover is bounded and
            near-categorical, so a correctly dispersed forecast for it is
            bimodal and its mean sits between the two modes.

            **Precipitation**: the NWS/NDFD tier of the hour's gated
            occurrence probability — nothing below 15%, "Slight Chance
            Showers" 15-24%, "Chance Showers" 25-54%, "Showers Likely"
            55-74%, and from 75% a flat "Rain" / "Light Rain" / "Heavy Rain"
            by expected rate (Stull Table 7-3: light < 2.5 mm/hr, heavy >
            7.6). From 15% the PHASE is `precip_type.kind`'s and
            the same tier ladder states its certainty: `snow` → "Slight
            Chance Snow" / "Chance Snow" / "Snow Likely" / "Snow";
            `rain_snow_mix` → "Slight Chance Rain/Snow Mix" / "Chance
            Rain/Snow Mix" / "Rain/Snow Mix Likely" / "Rain/Snow Mix";
            `freezing_rain` → "Slight Chance Freezing Rain" / "Chance Freezing
            Rain" / "Freezing Rain Likely" / "Freezing Rain"; `rain` (or no
            type) → the liquid labels above. The snow, mix and freezing-rain
            labels carry no showers word and no Light/Heavy intensity (snow
            intensity is a visibility grade, not a water rate). No probability
            chooses the phase; it once read the snow occurrence probability,
            which labelled an all-snow hour at 0.2-0.5 "Rain/Snow Mix" and one
            under 0.2 "Showers". Clients should treat unknown values as
            additive.
          enum:
          - Sunny
          - Mostly Sunny
          - Partly Cloudy
          - Mostly Cloudy
          - Cloudy
          - Clear
          - Mostly Clear
          - Slight Chance Showers
          - Chance Showers
          - Showers Likely
          - Rain
          - Light Rain
          - Heavy Rain
          - Slight Chance Rain/Snow Mix
          - Chance Rain/Snow Mix
          - Rain/Snow Mix Likely
          - Rain/Snow Mix
          - Slight Chance Snow
          - Chance Snow
          - Snow Likely
          - Snow
          - Slight Chance Freezing Rain
          - Chance Freezing Rain
          - Freezing Rain Likely
          - Freezing Rain
          example: Partly Cloudy
        condition_icon:
          type: string
          description: |
            Icon hint (prefixed with night_ for nighttime). Sky-only hints
            name the five sky classes. Precipitating hints carry the SIDE of
            the sky: `sun_*` (`night_moon_*`) when the sky leans clear
            (`P(< 40%) > P(>= 80%)`) — a sun or moon beside the rain cloud —
            and plain otherwise. Additive: `sun_chance_showers`,
            `sun_showers_likely`, `night_moon_chance_showers`,
            `night_moon_showers_likely`, `mostly_sunny`, `mostly_cloudy`,
            `night_mostly_clear`, `night_mostly_cloudy`, `showers_likely`,
            `night_showers_likely`. Retired: `sun_rain`, `scattered_showers`,
            `night_scattered_showers`, `rain_likely`, `night_rain_likely`
            (the hourly never says "likely rain"; an hour below the definite
            tier is showers). Snow, mix and freezing-rain conditions take
            their phase's icon at every tier (`snow`, `rain_snow_mix`,
            `freezing_rain`, and the `night_` forms). Additive:
            `freezing_rain`, `night_freezing_rain`.
          example: partly_cloudy
          enum:
          - sunny
          - mostly_sunny
          - partly_cloudy
          - mostly_cloudy
          - cloudy
          - sun_chance_showers
          - sun_showers_likely
          - chance_showers
          - showers_likely
          - rain
          - light_rain
          - heavy_rain
          - rain_snow_mix
          - snow
          - freezing_rain
          - night_clear
          - night_mostly_clear
          - night_partly_cloudy
          - night_mostly_cloudy
          - night_cloudy
          - night_moon_chance_showers
          - night_moon_showers_likely
          - night_chance_showers
          - night_showers_likely
          - night_rain
          - night_light_rain
          - night_heavy_rain
          - night_rain_snow_mix
          - night_snow
          - night_freezing_rain
        gust_notable:
          type: boolean
          description: |
            Whether the hour's gust is worth showing beside the wind -- its median at least 1.3 times the wind's median and at least 5 mph (2.2 m/s) above it. Omitted where the hour serves no gust.
        precip_type:
          anyOf:
          - $ref: '#/components/schemas/PrecipType'
          - type: 'null'
          description: Present only when precipitation > 0
        inversion:
          anyOf:
          - $ref: '#/components/schemas/InversionInfo'
          - type: 'null'
          description: Present only when a temperature inversion or cold pool is detected for this hour
        freezing_level:
          anyOf:
          - $ref: '#/components/schemas/FreezingLevel'
          - type: 'null'
          description: |
            The hour's freezing level. Omitted when the profile has no level above the surface to read it from.
        ensemble:
          $ref: '#/components/schemas/EnsembleStats'
        provenance:
          allOf:
          - $ref: '#/components/schemas/HourProvenance'
          description: |
            Present only with `?diagnostics=provenance` -- which post-processing rule shaped each variable this hour. A diagnostic for research and verification, not for display.
        model_means:
          $ref: '#/components/schemas/ModelMeans'
        members:
          type: array
          description: |
            Per-member ensemble values, one `{id, members}` per model with
            members at this hour, in `model_run.models` order (it was an object keyed by model). Only present with
            `?members=true` -- for spaghetti plots and plumes. A model with
            no members at this hour is absent. The 6-hourly models have
            members at every 6th hour, rrfs at every hour to 84 h.
          items:
            type: object
            required:
            - id
            - members
            properties:
              id:
                type: string
                example: gefs
              members:
                type: array
                items:
                  $ref: '#/components/schemas/MemberForecast'
        members_cumulative:
          $ref: '#/components/schemas/MembersCumulative'
        cumulative_precipitation:
          type: number
          description: |
            The HEADLINE's running precipitation total -- the sum of
            `ensemble.precipitation.mean` from the first served hour ("now") through this one, in the request's units. The running
            line `snow_outlook` is the 24 h / 48 h / 7 d point of; draw it on
            the plume beside the members' band. A mean is additive, so this is
            exact; percentiles are not, so there is no running headline band
            (the members' is `members_cumulative`). Never compute it on the
            client.
        cumulative_snowfall:
          type: number
          description: |
            The headline's running snowfall total, as
            `cumulative_precipitation` over `ensemble.snowfall.mean`; present
            exactly when the hour serves `ensemble.snowfall`.
    HourProvenance:
      type: object
      description: |
        Which serve-path branch produced this hour. Each list names the
        `ensemble` field it applies to, so a tag joins to the value it
        describes with no lookup table.

        These are **observations, not inferences**: every entry is set at the
        branch that ran, inside the serving code, not derived from the numbers
        afterwards. Use it to tell a calibrated hour from a backstopped one —
        the shape of the served distribution cannot tell you (a linearly
        pooled multi-model blend converges to near-Gaussian once the models
        agree, so it is indistinguishable from a fitted Gaussian).

        `ngr`, `borrowed` and `fallback` **partition** the variables the
        correction stage ran on. A variable in none of them was not corrected
        at this hour — a distinct state. Do not read absence as any outcome.

        Every list is omitted when empty and the whole object is omitted when
        the hour has nothing to report (a native model step, every variable
        NGR-corrected, no floor and no clamp), so a healthy forecast carries
        almost no extra payload. Absence of the object on EVERY hour of a
        response means the deploy predates this field, not that nothing
        happened — a provenance-serving deploy always reports at least the
        temperature correction.
      properties:
        densified:
          type: boolean
          description: |
            This hour sits strictly between two native model steps: its
            instantaneous values were linearly interpolated (plus a diurnal
            bulge), not read from a model step. Omitted when false.
        ngr:
          type: array
          description: |
            Variables corrected by a fitted NGR / truncated-NGR /
            censored-gamma model for this location, variable and lead-time bin.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - precipitation
        fallback:
          type: array
          description: |
            Variables served through the `inflate_around_mean` fallback because
            no fitted model was available for that lead-time bin. The widening
            is a configured constant, not a calibration.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - dewpoint
          - wind_speed
        borrowed:
          type: array
          description: |
            Variables at a point no fitted station reaches (none within 75 km),
            served from the fits of climatologically similar supplemental
            stations (same terrain class, ranked by distance and elevation
            difference, kept apart from one another) and shrunk toward the
            fallback. Borrowed statistical strength, not a calibration trained
            for this point. Added 2026-10-09; only variables whose
            borrowed fit beat the fallback on held-out stations borrow.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - dewpoint
        spread_floored:
          type: array
          description: |
            Variables whose percentile ladder was rebuilt as
            `N(mean, min_serve_sigma)` by the serve-time spread floor. Such a
            ladder carries no ensemble information: every probability read off
            it is fabricated at the floor width. Treat the mean as usable and
            the uncertainty around it as not.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
        floor_clamped:
          type: array
          description: |
            Variables whose low tail was truncated by the zero floor. The
            truncation biases the conditional mean upward; it is a backstop,
            not a neutral operation.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - precipitation
        bucket_split:
          type: array
          description: |
            Accumulation variables whose value at this hour is an even share of
            a wider accumulation, not an independently modelled hourly rate:
            either a native multi-hour bucket split across the hours between
            two model steps, or a contributor's
            accumulation spread evenly across the hours that failed to download
            before it — the missing hours are served with their share, and no
            hour carries a multi-step total. Every hour of the same split
            carries the identical share by construction. (This replaces the
            short-lived `accumulation_interval_hours`, which tagged the widened
            total instead of splitting it.)
          items:
            type: string
            enum:
            - precipitation
            - snowfall
          example:
          - precipitation
          - snowfall
        distribution_parameters:
          type: array
          description: |
            Variables whose blend included a contributor that supplied a
            two-parameter predictive distribution (a location and a scale)
            instead of ensemble members. NOAA's REFS publishes `mean` and
            `sprd` for RRFS and no member files at all, so RRFS contributes a
            measured Gaussian rather than a draw of members.

            Published because such a contributor is invisible in the served
            numbers, and it is not scored like a member-based one: it yields a
            closed-form CRPS and no rank, so a rank histogram covering these
            hours describes only the models that did have members.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - dewpoint
        spread_interpolated:
          type: array
          description: |
            Variables whose spread was not measured by ANY contributor at this
            hour and was interpolated from the bracketing hours that did
            measure it. The global ensembles publish on a 6-hourly native step
            while RRFS is hourly, so at the five leads between those steps
            RRFS is the only contributor and supplies a location with no
            distribution; the served ladder there is the two bracketing hours'
            quantile shape, re-centred on this hour's own mean.

            Published because it is invisible in the numbers: the ladder is
            well formed and derived from real measurements, but the
            measurements were taken at neighbouring leads. This and
            `spread_floored` are the two outcomes of the same branch and are
            mutually exclusive — an hour with no usable bracket (start of
            series, end of series, or a gap wider than the coarsest native
            step) is floored and says so instead of being interpolated.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - dewpoint
        interpolated_contributor:
          type: array
          description: |
            Variables whose pool at this hour contains at least one contributor
            that did NOT publish at this lead. Its distribution was
            interpolated from its two bracketing native steps (linearly in the
            mean, in every quantile and in the scale, with the same diurnal
            shaping the hourly densifier applies to any chord) so the pool —
            and therefore its spread — is the same set of contributors at
            every lead.

            This is the ORDINARY state of five lead hours out of six: the
            global ensembles publish on a 6-hourly native step and the
            convection-allowing model is hourly. It is published for that
            reason, not in spite of it — a client reading an untagged hour as
            fully measured would be wrong about most of the series.

            It is not a quality warning. Pooling an interpolated contributor is
            strictly more honest than serving one model's spread as the
            pool's, which is what these hours did before. What the tag tells
            you is how much of the hour's inter-model disagreement was
            measured AT this lead.

            `model_stats.<model>.interpolated` (served with `models=true`)
            names WHICH contributors were carried; this array says only that
            the hour has at least one, and is served on every response.

            Distinct from `spread_interpolated`: that one means the hour had no
            pool at all and borrowed a SHAPE after the blend; this one means
            the hour has a pool and part of it was carried across leads before
            it. In practice they are near-exclusive.

            `precipitation` and `snowfall` can never appear here. An
            accumulation's stored value is a bucket over the interval ending at
            its native step, not a level at an instant, and its zero is an
            absolute (a genuinely dry hour), so a contributor that did not
            publish at this lead contributes no accumulation to it at all —
            the hourly densifier's bucket split keeps handling those.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - dewpoint
          - wind_speed
        moment_matched_family:
          type: array
          description: |
            Variables whose served `probability` was computed from a
            distribution recovered by METHOD OF MOMENTS from the hour's mean
            and standard deviation, rather than from the exact parameters the
            calibration fit produced.

            It changes what the probability means. `precipitation`'s fitted
            family is a censored SHIFTED gamma, and the shift is what gives a
            dry hour real probability mass at exactly zero. The
            moment-matched fallback is an UNSHIFTED gamma, for which
            `P(amount = 0) = 0` — a distribution that cannot represent a dry
            hour at all, however dry the forecast. The exact parameters travel
            with a directly postprocessed hour and are dropped by every path
            that recombines a distribution (spatial pooling, temporal
            interpolation, daily aggregation), because pooling two censored
            shifted gammas does not produce a third one.

            Absent this tag, the hour's probability came from the exact fit.

            Only `precipitation` can carry it: it is the one served variable
            whose calibration fit produces exact distribution parameters.
            `snowfall` has no registered family and is always served a
            Gaussian — a property of the variable, not of the hour — so it is
            never listed here. The DAILY `precip_probability` /
            `snow_probability` are a different estimator again; see their own
            descriptions.
          items:
            type: string
            enum:
            - precipitation
          example:
          - precipitation
        lapse_profile:
          type: array
          description: |
            Variables carried from the location's primary elevation
            to this point's elevation by the hour's OWN upper-air lapse rate
            (the profile bracketed the layer). Only an
            `elevation_forecasts[].hourly` hour can carry it.
          items:
            type: string
            enum:
            - temperature
          example:
          - temperature
        lapse_climatology:
          type: array
          description: |
            Variables carried from the location's primary elevation
            to this point's elevation by a CLIMATOLOGICAL lapse rate — for
            `temperature` because the hour's profile could not bracket the
            layer (always the case below the primary, where the profile
            starts), the diurnal table; for `dewpoint` always, a mean 2 °C/km
            (no upper-air humidity is ingested). Only an
            `elevation_forecasts[].hourly` hour can carry it.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
          example:
          - temperature
          - dewpoint
        lapse_prism:
          type: array
          description: |
            Variables carried from the location's primary elevation
            to this point's elevation by the local PRISM
            precipitation–elevation regression: the PRISM 800 m
            climatological normals at the observing stations within 40 km,
            regressed on the stations' elevations (distance-weighted, Daly
            et al. 2008), give the ratio of the normal at this elevation to
            the normal at the primary's for the valid time's month, and the
            hour's corrected `precipitation` and `snowfall` distributions are
            scaled by it (every rank, mean and spread; the probability of
            any precipitation is unchanged). Absent when the neighbourhood
            cannot determine a slope (fewer than five stations, or under
            300 m of elevation span) or PRISM is not loaded — the amounts
            are then the primary's. Only an `elevation_forecasts[].hourly`
            hour can carry it.
          items:
            type: string
            enum:
            - precipitation
            - snowfall
          example:
          - precipitation
          - snowfall
        spread_clamped_low:
          type: array
          description: |
            Variables whose calibration fit was accepted and served, but whose
            fitted spread fell BELOW the serve-time spread band and was
            re-inflated to the band's low edge. The mean is the fit's; the
            uncertainty around it is the band's, not the fit's. A coverage or
            PIT statistic computed over such hours describes the band.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
        spread_clamped_high:
          type: array
          description: |
            Variables whose calibration fit was accepted and served, but whose
            fitted spread rose ABOVE the serve-time spread band and was cut
            back to the band's high edge. The mean is the fit's; the
            uncertainty around it is the band's, not the fit's. A coverage or
            PIT statistic computed over such hours describes the band.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - wind_gust
        gust_dressed:
          type: array
          description: |
            Variables whose pool at this hour included a contributor that
            publishes a 10 m wind but no gust (the AI ensembles) and was
            dressed from its mean wind by the WMO in-land gust factor of 1.75
            (Harper, Kepert & Ginger 2010, WMO/TD-No. 1555, Table 1.1). The
            dressed contributor carries its wind's spread, not a gust-specific
            one. Only `wind_gust` can appear here. Since the served gust is
            derived from the served wind, it carries the wind's
            provenance and this list is empty on every hour that serves a wind.
          items:
            type: string
            enum:
            - wind_gust
          example:
          - wind_gust
    Sector:
      type: object
      required:
      - from
      - to
      description: |
        A clockwise arc on the compass, degrees. `to` may be numerically
        smaller than `from` because the arc crosses north; the width is
        `(to - from) mod 360`, never `to - from`, and a bearing `b` lies
        inside it when `(b - from) mod 360 <= (to - from) mod 360`.
      properties:
        from:
          type: number
          format: double
        to:
          type: number
          format: double
      example:
        from: 350.0
        to: 10.0
    CircularStats:
      type: object
      required:
      - mean
      - sector_50
      - sector_90
      description: |
        A bearing's distribution stated on the circle. Weather APIs
        serve a direction as one number; the statistical convention for a
        direction DISTRIBUTION is a mean direction with a dispersion beside
        it and intervals as clockwise arcs. Degrees in both unit systems.
      properties:
        mean:
          type: number
          format: double
          description: The resultant-vector mean direction, degrees clockwise from north, in [0, 360).
            Equals `wind_direction.mean`.
        stddev:
          type:
          - number
          - 'null'
          format: double
          description: |
            Standard deviation of the members' signed angular offsets from
            `mean`, degrees. Exact for a concentrated distribution and never a
            difference of two bearings. Absent on a single-member hour.
        sector_50:
          allOf:
          - $ref: '#/components/schemas/Sector'
          description: The central 50 % of the members — the clockwise arc from the 25th to the 75th circular
            percentile.
        sector_90:
          allOf:
          - $ref: '#/components/schemas/Sector'
          description: The central 90 % of the members — the clockwise arc from the 5th to the 95th circular
            percentile.
      example:
        mean: 355.0
        stddev: 11.2
        sector_50:
          from: 348.0
          to: 2.0
        sector_90:
          from: 341.0
          to: 9.0
    MemberForecast:
      type: object
      description: |
        One ensemble member's values at a single forecast hour. All physical
        fields are in the caller's unit system (metric or imperial) —
        temperature in °C/°F, precipitation & snowfall in mm/in, wind speed
        in m/s or mph, snow level in m/ft. `slr` is unitless.

        **Every value is a measurement or `null` (breaking, 0.480.0).**
        The global ensembles (gefs, aigefs, ifs_ens/aifs) publish on a
        6-hourly native step while rrfs is hourly, so at five lead hours out
        of every six the 6-hourly models' members carry no data at all.
        Those members previously served a literal `0.0` for temperature,
        precipitation and wind speed — a freezing, dry, dead-calm member
        indistinguishable from a real one. They now serve `null`.
        `temperature` was NOT nullable before this release; a client that
        parses it as a plain number must handle `null`.

        **Single precision.** The model data is stored as 32-bit
        floats, so every member value is one: the JSON writes the shortest
        decimal that names it (`-6.92`, not `-6.920000076293945`). A value
        read straight off the model is exactly what is stored; a computed
        one (corrected, unit-converted, snowfall) is rounded to the nearest
        32-bit float (relative change at most 6e-8).
      required:
      - member_id
      properties:
        member_id:
          type: integer
          description: |
            The member's position on its model's ensemble axis, from 0:
            stable across the hours of a response and across cycles, and
            numbered per model (a member is `(model, member_id)`). 0 is the
            control for `aifs` (cf), `aigefs` (mem000) and `gefs` (gec00);
            `ifs_ens` has no control in ECMWF open data, so its 0..49 are
            perturbed members 1..50; `rrfs` is the one deterministic run, 0.
            Serializes as a JSON number (changed from string in 0.30.x —
            ALLOC-5).
          example: 12
        temperature:
          type:
          - number
          - 'null'
          format: double
          description: |
            `null` when this member published nothing at this hour.
            Became nullable in 0.480.0 — previously a fabricated `0.0`.
        precipitation:
          type:
          - number
          - 'null'
          format: double
          description: |
            `null` when this member published nothing at this hour. A
            measured `0.0` (a genuinely dry member) is still served as
            `0.0` — the two are different claims. The value is the
            TOTAL over the `precipitation_hours` hours ending at this hour —
            a 6-hourly model's whole 6-hour amount at its native step, and
            `null` between — so summing a member's `precipitation` over time
            gives its accumulated total.
        precipitation_hours:
          type: integer
          minimum: 1
          description: |
            How many hours `precipitation` (and `snowfall`) covers, ending at this hour: back to this model's previous precipitation step (1 for an hourly model, 6 for a 6-hourly one). A model's FIRST served value states its span too -- a run that stores no lead 0 (aigefs) carries the total since its own init (e.g. 6), and a model whose cycle is older than `model_run.initialized_at` has its first bucket cut to its one-hour share at the read, so it says 1. Omitted when `precipitation` is absent, and for a run's analysis value at its own init (lead 0), which covers no forecast hour.
        wind_speed:
          type:
          - number
          - 'null'
          format: double
          description: |
            `null` when this member published nothing at this hour.
        wind_direction:
          type:
          - number
          - 'null'
          format: double
        snow_level:
          type:
          - number
          - 'null'
          format: double
        slr:
          type:
          - number
          - 'null'
          format: double
          description: |
            Snow-to-liquid ratio for this member (unitless). Higher = fluffier
            snow. Omitted for models that don't diagnose SLR (RRFS may not
            always provide it).
        snowfall:
          type:
          - number
          - 'null'
          format: double
          description: |
            Per-member snowfall depth at the location's elevation, computed
            as `precipitation × effective_slr(slr, elevation, snow_level)`.
            Omitted when the derivation is impossible: no SLR, no snow level,
            or no precipitation MEASUREMENT for this member. A member whose
            precipitation was measured at `0.0` serves a present `0.0`
            instead, so "this member gets no snow" stays distinct from "we
            cannot say". Its surface wet-bulb gate reads the member's
            own temperature and dewpoint; a member without a 2 m dewpoint
            (`aigefs`) is gated on its own temperature with the
            served dewpoint. It also takes the headline's drizzle
            gate over the hours its `precipitation_hours` span -- a light
            hour (median precipitation under 0.5 mm) at or above 0 °C states
            0 mm of snow in the headline, and the member's snowfall is
            scaled by the share of its hours the gate admits -- so a plume
            cannot snow where the hourly headline states none for that
            reason.
        cumulative_precipitation:
          type: number
          format: double
          description: |
            This member's running precipitation total (mm / in) from
            the start of the served window through this hour -- the sum of
            its `precipitation` over every served hour up to here. The window
            opens ONE HOUR BEFORE the first served `valid_time` (the span of
            the first hour's own value): the current hour by default, the
            run's init with `include_past=true` or a pinned `run`
            -- the window the served `snow_outlook` totals over too. A value whose span
            (`precipitation_hours`) began before the window counts only its
            share inside it, `precipitation × (hours of the span inside the
            window) / precipitation_hours` (the headline spreads a bucket
            evenly over its hours the same way); a value with no span (a
            run's analysis at its own init) counts in full. Present exactly
            when `precipitation` is. Clients should draw cumulative QPF from
            this instead of summing.
          example: 0.62
        cumulative_snowfall:
          type: number
          format: double
          description: |
            This member's running snowfall total (mm / in), by the
            same window and share rule as `cumulative_precipitation` over its
            `snowfall`. Present exactly when `snowfall` is.
          example: 7.4
    MembersCumulative:
      type: object
      description: |
        The distribution of the members' running totals at this hour
        -- for each quantity, percentiles over every member's
        `cumulative_precipitation` / `cumulative_snowfall` here. Computed from
        the cumulative distribution, NEVER by summing hourly percentiles
        (quantiles are not additive: the sum of hourly p90s is far above the
        p90 of the total). Present at an hour where at least
        two members carry a running total -- in practice the 6-hourly
        synoptic hours (00/06/12/18Z), since between them only RRFS's single
        member has a value; absent at the other hours. A quantity fewer than
        two members carry is omitted. The members are equally weighted:
        this is the member spread, not the Ourea forecast -- the headline
        total is the served `snow_outlook` (the calibrated, skill-weighted
        blend's mean; a served running headline total is to come). Clients draw these served values and never
        compute percentiles or totals themselves.
      properties:
        precipitation:
          $ref: '#/components/schemas/Quantiles'
        snowfall:
          $ref: '#/components/schemas/Quantiles'
      example:
        precipitation:
          mean: 0.58
          min: 0.11
          p10: 0.24
          p25: 0.39
          p50: 0.55
          p75: 0.74
          p90: 0.93
          max: 1.41
        snowfall:
          mean: 6.9
          min: 0.8
          p10: 2.6
          p25: 4.4
          p50: 6.5
          p75: 9.1
          p90: 11.8
          max: 18.2
    InversionInfo:
      type: object
      description: |
        Surface-based cold pool or elevated inversion detected from the
        model's vertical temperature profile. Clients can use this to
        badge hours where "warmer aloft than at the surface" conditions
        are in effect.
      required:
      - kind
      - depth
      - strength
      properties:
        kind:
          type: string
          description: |
            `surface_shallow`: shallow (<300 m) surface-based inversion,
              common overnight in calm/clear conditions.
            `cold_pool`: deep (≥300 m) surface-based cold pool, can
              persist for days under a ridge.
            `elevated`: warm layer aloft above a normal surface layer
              (subsidence, capped boundary layer).
          enum:
          - surface_shallow
          - cold_pool
          - elevated
          example: cold_pool
        depth:
          type: number
          format: double
          description: |
            Depth of the inversion layer in the caller's length units
            (meters for metric, feet for imperial). For `elevated`, this
            is the thickness of the warm layer (top − base).
          example: 430.0
        strength:
          type: number
          format: double
          description: |
            Temperature difference driving the inversion in the caller's
            temperature units. Always positive: the warm part minus the
            cold part.
          example: 4.2
    PrecipType:
      type: object
      description: |
        Predicted precipitation type derived from the mean snow level,
        station elevation, and the hour's served (corrected) surface
        temperature and dewpoint, on the same rule, and the same
        temperature, the served `snowfall` accumulates at. The snow
        level is the bottom of the melting layer, where falling snow has
        fully melted; the rain/snow mix lies ABOVE it, from the snow level
        up to the all-snow height about 127 m higher. Absent when the hour
        has no snow level: the phase cannot be placed.
      required:
      - type
      - snow_probability
      - rain_probability
      properties:
        type:
          type: string
          enum:
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
          description: |
            The categorical reading of `snow_probability`: `snow` only at
            1 (and at most 2 °C), `rain_snow_mix` strictly between 0 and 1,
            `rain` or `freezing_rain` at 0. `freezing_rain` is fully melted
            precipitation (the location at or below the snow level) falling
            onto a surface below 0 °C. The hourly `condition` states this
            type's phase: a Snow, Rain/Snow Mix or Freezing Rain
            label, or a liquid label for `rain`.
        snow_probability:
          type: number
          format: double
          description: |
            Share of the hour's precipitation that falls as snow (0-1): the
            melting layer's snow fraction at the location (0 at and below
            the snow level, 1 from about 127 m above it, linear in melting
            energy between) times the surface snow share — all snow at or
            below 2 °C air temperature, none at or above 4 °C, and the
            surface wet-bulb fade (none at or above 2 °C wet-bulb). It is
            the share the served `snowfall` accumulates at, so a warm rain
            hour has 0 and an hour inside the mixed band carries
            its fraction. Conditional on precipitation; for the
            chance that snow accumulates at all, use
            `ensemble.snowfall.probability`.
          example: 0.75
        rain_probability:
          type: number
          format: double
          description: '`1 - snow_probability` (0-1).'
          example: 0.25
    EnsembleStats:
      type: object
      required:
      - temperature
      - dewpoint
      - precipitation
      - wind_speed
      - wind_direction
      - snow_level
      properties:
        temperature:
          $ref: '#/components/schemas/Quantiles'
        feels_like:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Apparent temperature, the NWS convention: the wind chill (NWS 2001, Osczevski & Bluestein 2005) where the air is at or below 10 C (50 F) and the 10 m wind above 4.8 km/h (3 mph); the heat index (NWS / Rothfusz 1990) where the air is at or above 26.7 C (80 F); the air temperature everywhere else. It is computed for EACH ensemble member from that member's own temperature, wind and dewpoint (the calibrated values at the member's rank in each), and only then summarised, so the statistics describe states members actually forecast: a cold, calm member and a warm, windy one never combine into a cold, windy extreme. Every quantile lies within the range of the members' own values. A member with no dewpoint of its own takes the ensemble's mean dewpoint; with no dewpoint at all for the hour, no heat index is applied. Omitted when the hour has no members to compute it from. This is the default index (`feels_like=nws`); see `feels_like_utci`.
        feels_like_utci:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            The Universal Thermal Climate Index (Bröde et al. 2012), same unit as `temperature`, with a mean radiant temperature from the members' surface radiation, computed per member like `feels_like`. Present only with `feels_like=utci` (or `nws,utci`), which is NOT served yet -- a `400 FEELS_LIKE_UNAVAILABLE` until -- so it is absent from every response today.
        dewpoint:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        precipitation:
          $ref: '#/components/schemas/Quantiles'
        wind_speed:
          $ref: '#/components/schemas/Quantiles'
        wind_gust:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Peak gust (same unit as `wind_speed`). Indicates lift closure risk at ski areas.
            Derived from the served sustained wind: every rank (and the mean and spread) is
            `wind_speed` times a fitted gust factor of 1.54, so a gust is never below the
            wind it accompanies. The wind's calibration (station fit, spread) is the gust's,
            and so is its `provenance`. Absent at lead 0.
        wind_direction:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            **Circular — read this before using any of these numbers.**
            Wind direction is pooled across models ON THE CIRCLE,
            so this `Quantiles` describes an ARC, not an interval on the
            number line:

            * The ladder is ordered by offset from `mean`, NOT by degrees. A
              northerly hour serves `min: 340, p50: 355, p75: 5, max: 20` —
              `p50 > p75` and `min > max` are correct here, not a bug. Do not
              sort it, do not treat `min`/`max` as bounds, and do not clamp a
              value into `[min, max]`.
            * `mean` is the weighted resultant direction
              (`atan2(sum w sin, sum w cos)`), not an average of the rungs.
              When the contributors are near-opposed the resultant is not
              identified and the direction returned is arbitrary (an exactly
              opposed pair resolves to 90 deg from a floating-point residue) —
              read `spread` before trusting `mean`.
            * `spread` is the ARC from `min` to `max`, computed on the circle,
              and is the one field here that is honest in every case. Use it
              for uncertainty width. It is identical to `max - min` for any
              hour that does not cross north.
            * Degrees in both unit systems; `?units=imperial` does not convert
              a bearing.

            Whether a linear `(min, ladder, max)` triple can
            represent a circular interval: it cannot, and the circular shape
            is served beside it as `wind_direction_circular`. Read that; this
            ladder stays for compatibility.
        wind_direction_circular:
          allOf:
          - $ref: '#/components/schemas/CircularStats'
          description: |
            The wind direction as a CIRCULAR distribution: the
            resultant mean, an offset-frame standard deviation, and the
            central 50 % and 90 % of the members as clockwise arcs. Present on
            every hour that carries `wind_direction`.
        snow_level:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        slr:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        snowfall:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Hourly snowfall depth at the location's elevation (mm, or inches
            for imperial callers): the hour's precipitation times the
            effective snow-to-liquid ratio at the point, with `probability`
            the chance of measurable snow. An hour whose snowfall
            was ASSESSED -- precipitation, SLR and snow level all present --
            and came out dry (the point is below the snow level, the surface
            is too warm, or the median precipitation is under the drizzle
            gate) serves a present zero: every rank `0` and `probability`
            `0`. The field is absent (or `null`) only when an input is
            missing and the hour could not be assessed, so absent means
            "unknown", never "no snow" -- the convention the member plumes'
            `snowfall` already follows.
        cloud_cover:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: Cloud cover percentage (0-100%)
        skin_temperature:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Skin / ground surface temperature in the caller's temperature units. Sourced from IFS ENS `skt` — a proxy for snow-surface temperature at ski areas and pavement-approximate temperature off-road. Null when no model with this variable contributed to this hour's blend.
        ptype:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Present only with `?diagnostics=ptype` (a model-native diagnostic; per-category probabilities are a follow-up). Model-native precipitation type code (ECMWF `ptype` convention). 1 = rain, 3 = freezing rain, 5 = snow, 6 = wet snow, 7 = mixed, 8 = ice pellets. Encoded as `Quantiles` so ensemble agreement is visible — e.g. `p25 == p75 == 5` means all members agree on snow. Distinct from the derived `precip_type` label on `TimeSeriesPoint`, which is a friendlier snow/rain/mix categorization derived from SLR plus snow level.
        mslp:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Mean sea-level pressure: hPa for `metric` and `kelvin`, inHg for `imperial`. A raw blend of the contributing models; no pressure observation trains a correction. Omitted when no contributing model published it for this hour.
        cape:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Convective available potential energy, J/kg in every unit system. A raw blend of the models that publish it (AIFS and AIGEFS do not). Omitted when none contributed to this hour — never served as a zero, which would read as "stable".
        relative_humidity:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Relative humidity, percent 0–100 in every unit system, computed like `feels_like`: for each ensemble member from its own calibrated temperature and dewpoint, then summarised, so no percentile pairs one member's temperature with another's dewpoint. Omitted when `dewpoint` is.
    FreezingLevel:
      description: |
        The hour's freezing level: the lowest altitude at which the air is at 0 °C (AMS Glossary), from the same surface + pressure-level profile `inversion` reads. Tagged by `kind` (a discriminator); heights are MSL in the caller's length units (m, or ft for `imperial`).
      oneOf:
      - $ref: '#/components/schemas/FreezingLevelBelowSurface'
      - $ref: '#/components/schemas/FreezingLevelHeight'
      - $ref: '#/components/schemas/FreezingLevelAboveProfile'
      discriminator:
        propertyName: kind
        mapping:
          below_surface: '#/components/schemas/FreezingLevelBelowSurface'
          height: '#/components/schemas/FreezingLevelHeight'
          above_profile: '#/components/schemas/FreezingLevelAboveProfile'
    FreezingLevelBelowSurface:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - below_surface
          description: At or below 0 °C at every level — freezing from the surface up.
    FreezingLevelHeight:
      type: object
      required:
      - kind
      - height
      - above_freezing_layer_aloft
      properties:
        kind:
          type: string
          enum:
          - height
        height:
          type: number
          description: The lowest 0 °C height, MSL.
        above_freezing_layer_aloft:
          type: boolean
          description: |
            An above-freezing layer sits higher up — an inversion's warm nose, the freezing-rain / sleet profile.
    FreezingLevelAboveProfile:
      type: object
      required:
      - kind
      - top
      properties:
        kind:
          type: string
          enum:
          - above_profile
        top:
          type: number
          description: |
            Above 0 °C at every level read, up to this height (MSL). The freezing level is above it; not extrapolated.
    ModelMeans:
      type: array
      description: |
        One entry per model with statistics at this hour,
        `{id, <ModelStats>}`, in `model_run.models` order (it was an object
        keyed by model). A model with nothing at the hour is absent.
      items:
        allOf:
        - type: object
          required:
          - id
          properties:
            id:
              type: string
              example: gefs
        - $ref: '#/components/schemas/ModelStats'
    ModelStats:
      type: object
      properties:
        temperature:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: Absent when this model published nothing for the hour; never 0. The global ensembles
            publish on a 6-hourly step, so at five lead hours out of six a contributing model has nothing
            to report.
        dewpoint:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: 'Always absent for `aigefs`, which publishes no 2 m humidity and no surface pressure:
            the blended dewpoint, relative humidity and feels-like are pooled from the models that publish
            one, their weights renormalised over them.'
        precipitation:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: Absent when this model published nothing for the hour; never 0.
        wind_speed:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: Absent when this model published nothing for the hour; never 0.
        wind_direction:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Absent when this model published nothing for the hour; never 0.

            **Circular — read this before using any of these numbers.**
            Wind direction is pooled across models ON THE CIRCLE,
            so this `Quantiles` describes an ARC, not an interval on the
            number line:

            * The ladder is ordered by offset from `mean`, NOT by degrees. A
              northerly hour serves `min: 340, p50: 355, p75: 5, max: 20` —
              `p50 > p75` and `min > max` are correct here, not a bug. Do not
              sort it, do not treat `min`/`max` as bounds, and do not clamp a
              value into `[min, max]`.
            * `mean` is the weighted resultant direction
              (`atan2(sum w sin, sum w cos)`), not an average of the rungs.
              When the contributors are near-opposed the resultant is not
              identified and the direction returned is arbitrary (an exactly
              opposed pair resolves to 90 deg from a floating-point residue) —
              read `spread` before trusting `mean`.
            * `spread` is the ARC from `min` to `max`, computed on the circle,
              and is the one field here that is honest in every case. Use it
              for uncertainty width. It is identical to `max - min` for any
              hour that does not cross north.
            * Degrees in both unit systems; `?units=imperial` does not convert
              a bearing.

            Whether a linear `(min, ladder, max)` triple can
            represent a circular interval: it cannot. The blend's
            `ensemble.wind_direction_circular` carries the circular shape;
            this per-model ladder stays for compatibility.
        snow_level:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        slr:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        snowfall:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        interpolated:
          type: boolean
          description: |-
            `True` when this model did not publish at this lead and the stats above were interpolated from its two bracketing native steps, so the blend pools the same set of contributors at every lead. Omitted (absent) when the model published at this hour, which is the ordinary case — treat absence as `false`. The global ensembles publish 6-hourly and the convection-allowing model is hourly, so at five lead hours out of six the 6-hourly models' rows carry this flag.
            NOTE — `models=true` and `members=true` deliberately disagree here, and the disagreement is the honest answer to two different questions. A model's per-hour STATS can be interpolated to a lead it did not publish at, because a distribution between two distributions is a distribution. Its per-hour MEMBERS cannot: member 7 at lead 3 is a specific draw from a specific run, and interpolating member 7's two neighbouring values would invent a trajectory that ensemble never produced and would break the member-to-member correlation every spaghetti plot and every ECC reordering depends on. So the same hour serves `model_stats.aifs.temperature` with `interpolated: true` and `members.aifs[*].temperature = null`. The stats are the blend's input; the members are the raw draws.
    DailyForecast:
      type: object
      description: |
        Daily summary keyed by one local calendar date (the location's own
        US timezone, not always Pacific).

        **Windows (calendar day).** `high` and `low` (and
        `feels_like_high` / `feels_like_low`) are the maximum and minimum over
        the local CALENDAR date, midnight to midnight (23 or 25 hours on a
        DST date), so the pair always describes the same day. A date is
        served only once the forecast reaches 23:00 local on it. The first
        date (day 0) covers only the part of the day the model run reaches
        (from its init), with the latest station observation folded in. The
        rest of this object (`total_precip`, `total_snowfall`,
        `precip_probability`, `precip_occurrence_probability`,
        `snow_probability`, `snow_level_mean`, `cloud_cover_mean`,
        `precip_type`, `wind`) is also a sum or a mean over the calendar
        date. Only the `condition` sky label reads the daytime hours.

        **Two precipitation probabilities, deliberately.**
        `precip_occurrence_probability` = `P(day total >= 1.0 mm)` answers
        "will it precipitate at all" and is what `condition` and `precip_type`
        are derived from. `precip_probability` = `P(day total >= 2.5 mm)`
        answers "will it amount to anything" and stays the headline. Both come
        from the one day-total distribution, so the occurrence value is never
        below the 2.5 mm one. Neither is an NWS PoP — see
        `precip_occurrence_probability` for why its threshold is 1.0 mm rather
        than the 0.254 mm NWS event.

        **The daily horizon is `max_days`, never `max_hours`.**
        The rows are the model run's first `max_days` LOCAL dates, starting
        at the local date of forecast hour 1 (the run's first date with two
        hours on it — for a 00Z run in the US that is the evening of the
        PREVIOUS local date); default `max_days` is the tier's full horizon
        (Free 10, Pro 15). They are built from every forecast hour their
        calendar days need, through 23:00 on the last date, whatever
        `max_hours` is and whether or not the hourly series is served
        (`hourly=false`): `max_hours=6` returns the same `daily` array, row
        for row and value for value, as `max_hours=360`, and as
        `hourly=false`. The hourly `timeseries` is exactly the window asked
        for; the hours read for the dailies are never served. (Before
        the rows were cut at the local date of the last requested
        hour, so `max_hours=6` returned one row.)

        A date is published only once the forecast reaches 23:00 local on
        it, the date's last hour. Before that its `high`/`low` would depend
        on where the run's horizon stopped, so the day is left out instead of
        served truncated. In practice this only removes dates at the far end
        of a full-length run, so `daily` can carry fewer than `max_days`
        rows.
      required:
      - date
      - condition
      - condition_text
      - condition_icon
      - high
      - low
      - total_precip
      - precip_probability
      - precip_occurrence_probability
      - snow_probability
      - snow_level_mean
      - precip_display
      - astro
      properties:
        date:
          type: string
          format: date
        condition:
          type: string
          description: |
            A stable machine code to switch on -- the display text (`condition_text`) lowercased, each run of other characters one `_` (`partly_cloudy`, `rain_snow_mix_likely`). It was the display text. Treat unknown codes as additive.
          enum:
          - sunny
          - mostly_sunny
          - partly_cloudy
          - mostly_cloudy
          - cloudy
          - slight_chance_showers
          - chance_showers
          - chance_rain
          - showers_likely
          - rain_likely
          - showers
          - rain
          - slight_chance_rain_snow_mix
          - chance_rain_snow_mix
          - rain_snow_mix_likely
          - rain_snow_mix
          - slight_chance_snow
          - chance_snow
          - snow_likely
          - snow
          example: partly_cloudy
        condition_text:
          type: string
          description: |
            Human-readable weather condition for the day — a daytime label,
            on the same rule as the hourly `condition`.

            **Sky** (no precipitation expected): the day's most likely of five
            cloud-cover classes — Sunny (< 20%), Mostly Sunny (20-40), Partly
            Cloudy (40-60), Mostly Cloudy (60-80), Cloudy (>= 80). The
            per-hour class probabilities are read off each hour's served
            percentile ladder and averaged over the NWS DAYTIME window
            (06:00-18:00 local), coarse side first (`P(< 40%)`, `P(40-80%)`,
            `P(>= 80%)`, every edge and any tie going to the cloudier class) and then the half of that side. Not a threshold on
            `cloud_cover_mean`, whose own calendar-day meaning is unchanged.

            **Precipitation**: the NWS/NDFD tier of
            `precip_occurrence_probability` (P(day total >= 1 mm)) — nothing
            below 15%, "Slight Chance" 15-24%, "Chance" 25-54%, "Likely"
            55-74%, flat from 75% — worded "rain" when the day is STEADY (at
            least half of the daytime hours are more likely wet than dry AND
            `precip_probability`, the 2.5 mm number, exceeds 0.3) and
            "showers" otherwise: Slight Chance Showers, Chance Showers /
            Chance Rain, Showers Likely / Rain Likely, Showers / Rain. The
            PHASE is `precip_type`'s, as for the hour, on the same
            tiers, whatever `snow_probability` says: a `snow` day is "Slight
            Chance Snow" / "Chance Snow" / "Snow Likely" / "Snow", a
            `rain_snow_mix` day "Slight Chance Rain/Snow Mix" / "Chance
            Rain/Snow Mix" / "Rain/Snow Mix Likely" / "Rain/Snow Mix".
          enum:
          - Sunny
          - Mostly Sunny
          - Partly Cloudy
          - Mostly Cloudy
          - Cloudy
          - Slight Chance Showers
          - Chance Showers
          - Chance Rain
          - Showers Likely
          - Rain Likely
          - Showers
          - Rain
          - Slight Chance Rain/Snow Mix
          - Chance Rain/Snow Mix
          - Rain/Snow Mix Likely
          - Rain/Snow Mix
          - Slight Chance Snow
          - Chance Snow
          - Snow Likely
          - Snow
          example: Partly Cloudy
        condition_icon:
          type: string
          description: |
            Machine-readable icon hint for frontends. Sky-only hints name the
            five sky classes. Precipitating hints carry the SIDE of the sky:
            `sun_*` when the daytime sky leans clear (`P(< 40%) > P(>= 80%)`)
            — a sun beside the rain cloud — and plain otherwise. Additive: `mostly_sunny`, `mostly_cloudy`,
            `sun_chance_showers`, `sun_showers_likely`, `sun_showers`,
            `chance_rain`, `showers_likely`, `showers`. Retired: `sun_rain`,
            `scattered_showers`, `night_scattered_showers`.
          enum:
          - sunny
          - mostly_sunny
          - partly_cloudy
          - mostly_cloudy
          - cloudy
          - sun_chance_showers
          - sun_showers_likely
          - sun_showers
          - chance_showers
          - chance_rain
          - showers_likely
          - rain_likely
          - showers
          - rain
          - rain_snow_mix
          - snow
          example: partly_cloudy
        precip_type:
          type:
          - string
          - 'null'
          enum:
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
          - null
          description: |
            The day's precipitation type, `null` when `precip_occurrence_probability`
            is under 0.15. Read off the day's HOURLY phases:
            the day's snow share is the precipitation-weighted mean of the
            `timeseries[].precip_type.snow_probability` of its wet hours (the
            share of each hour's water that falls as snow), read at that
            field's 0.01 resolution — `snow` when at least 99.5% of the day's
            water is snow, `rain` when under 0.5% is (or no hour is typed),
            `rain_snow_mix` between. So a day whose wet hours are all
            `rain_snow_mix` is `rain_snow_mix`, and a rain day with one heavy
            snow hour is `rain_snow_mix`, not `rain`. `condition` states
            this type's phase at its tier: a Snow or Rain/Snow Mix
            label, or a liquid label.
            `freezing_rain` is an hourly type only; such hours count as liquid.
        high:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Calendar-day maximum: the max over local midnight to midnight on
            `date` (earlier releases: 06:00-18:00 only). On day 0, the
            part of the day the model run covers.
        low:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Calendar-day minimum: the min over local midnight to midnight on
            `date`, the same hours as `high` (earlier releases: the night
            that BEGINS on `date`, 18:00 through 06:00 the next morning). On
            day 0, the part of the day the model run covers. Label it
            "Low", not "Tonight".
        feels_like_high:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Calendar-day maximum of the hourly `feels_like` (the NWS apparent temperature), per member: each ensemble member's own hourly feels-like, that member's maximum over the same local calendar day as `high`, and the statistics across those members' maxima (`mean` their mean; `min`/`max` the lowest and highest member's). Every value is a day some member forecast. In wind it sits at or below `high`, in hot humid air at or above; on a mild day (above 10 C, below 26.7 C) it is the members' own daily high. Omitted when no member carries a feels-like through the window.
        feels_like_low:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            Calendar-day minimum of the hourly `feels_like` (the NWS apparent temperature), per member: each member's own minimum over the same local calendar day as `low`, and the statistics across those minima. It sits below `low` only by the wind chill of members that are both cold and windy. Omitted when no member carries a feels-like through the window.
        feels_like_utci_high:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            The daily UTCI maximum, built like `feels_like_high` from the hourly `feels_like_utci`. Present only with `feels_like=utci`, not served yet: absent today.
        feels_like_utci_low:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            The daily UTCI minimum, built like `feels_like_low` from the hourly `feels_like_utci`. Present only with `feels_like=utci`, not served yet: absent today.
        total_precip:
          $ref: '#/components/schemas/Quantiles'
        total_snowfall:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        precip_probability:
          type: number
          description: |
            **MEANINGFUL precipitation: `P(day total >= 2.5 mm)`** (0-1) — the
            headline number, the chance the day accumulates a tenth of an inch
            or more. For "will it precipitate at all", read
            `precip_occurrence_probability` instead; the two answer different
            questions and `precip_probability` is always the smaller of the
            two.

            The comparison is INCLUSIVE (`>=`) — the estimator reads 1.0 when
            the whole day-total ladder sits at or above the threshold.

            **A DIFFERENT ESTIMATOR from the hourly `probability`, at a
            different threshold.** It is read empirically off the day-total
            distribution — the same one `total_precip`'s quantiles come from,
            so the two can never disagree — whereas the hourly value is the
            survival function of the hour's calibrated distribution evaluated
            at 0.254 mm (NWS measurable). Do not compare the two directly, and
            do not expect `precip_probability` to equal `max` or `1 - prod(1 -
            p)` over the day's hourly probabilities.

            The 2.5 mm/day floor is deliberate: at 0.1 mm, a 21-rank ladder
            summed over 24 hours put 30-50% on days the NWS called clear,
            because a trace in any hour is enough. 2.5 mm is the
            user-intuitive "light shower" floor.
        precip_occurrence_probability:
          type: number
          description: |
            **OCCURRENCE: `P(day total >= 1.0 mm)`** (0-1) — the chance the day
            precipitates at all, as opposed to `precip_probability`'s chance
            that it amounts to anything. This is the number `condition`'s tier
            and `precip_type`'s dry gate read; their PHASE comes
            from the day's hourly phases (see `precip_type`).

            Same estimator and same distribution as `precip_probability` — an
            empirical, inclusive (`>=`) read off the day-total ladder that also
            produces `total_precip`'s quantiles — evaluated at a lower
            threshold, so `precip_occurrence_probability >= precip_probability`
            always holds. A day can be likely to get wet and unlikely to
            accumulate; that day is labelled showers, not rain, and both
            numbers are published so a client can say so too.

            **This is NOT an NWS PoP.** NWS PoP is `P(>= 0.01" = 0.254 mm)`;
            this is `P(>= 1.0 mm)`, a stricter event, so it reads LOWER than an
            NWS PoP for the same day. Do not label it "PoP" in a UI and do not
            compare the two numbers directly.

            **The threshold is PROVISIONAL and set by the estimator, not by
            meteorology.** The served day total is a rank sum over the day's
            hourly ensemble ladders, so a dry day's ladder is identically zero
            up to the rank at which its hours first turn wet. Every threshold
            below that first non-zero summed quantile therefore falls in the
            same rank band, and across the whole of that range the exceedance
            moves by only about 0.05 — its level is set by where the ladder
            stops being identically zero, not by the threshold.

            Measured 2026-09-18 through the serving code, on a 0.161 mm/day
            forecast whose ladder first lifts off at 0.2875 mm: 0.250 at a
            trace, 0.2058 at 0.254 mm, 0.200 at 0.2875 mm, 0.163 at 0.5 mm,
            0.0761 at 1.0 mm, 0.000 at 2.5 mm. At 0.254 mm that NWS-clear day
            is indistinguishable from a wet one; 1.0 mm is the lowest
            threshold at which the served distribution still discriminates.
        snow_probability:
          type: number
          description: |
            `P(day snowfall total >= 2.5 mm)` (0-1), inclusive. Same estimator,
            threshold and caveats as `precip_probability` — see its
            description. There is no snowfall counterpart to
            `precip_occurrence_probability`: snow occurrence is not separately
            calibrated.
        snow_level_mean:
          type:
          - number
          - 'null'
        snow_level:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day's snow level -- each rank the mean of the day's hourly ranks (the day-mean's distribution under the rank coherence the day totals assume). Omitted when no hour serves a snow level.
        total_precip_if_wet:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day total GIVEN a wet day (total >= the `daily_precip_occurrence_probability` threshold, 1.0 mm): the upper part of the day-total distribution, renormalized. Not the mean divided by the probability. Omitted under a 0.1 % chance.
        total_snowfall_if_wet:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day's snowfall given a snowy day (>= the `daily_snow_probability` threshold, 2.5 mm), as `total_precip_if_wet`.
        precip_display:
          $ref: '#/components/schemas/PrecipDisplay'
        cloud_cover_mean:
          type:
          - number
          - 'null'
          description: |
            Average cloud cover for the day (0-100%). This is the mean of the
            day's hourly cloud-cover means and its meaning is unchanged — but
            it is NOT what `condition` is derived from: the sky
            label is the day's most likely cloud-cover CLASS, so a bimodal day
            can read `cloud_cover_mean` near 50 and still be labelled Cloudy.
        wind:
          type:
          - object
          - 'null'
          description: Daily wind summary. Uses gust data when available, otherwise sustained wind.
          properties:
            status:
              type: string
              enum:
              - calm
              - light
              - moderate
              - strong
              - very_strong
              - extreme
              description: |
                Wind severity classification based on peak gust/speed. calm: <11 mph, light: 11-22, moderate: 22-34, strong: 34-49 (lifts affected), very_strong: 49-67 (most lifts closed), extreme: 67+ (all lifts closed).
            peak_speed:
              type: number
              description: |
                Peak wind for the day (mph imperial, m/s metric): the expected peak — the maximum over the day's hours of the hourly gust ensemble mean when gust data is available, otherwise of the sustained wind mean. Comparable to a deterministic provider's daily gust (NWS).
            peak_speed_p90:
              type: number
              description: |
                The 90th-percentile counterpart of peak_speed (the maximum over the day's hours of the hourly gust p90), a "gusts could reach" upper band. Omitted when is_gust is false.
            is_gust:
              type: boolean
              description: Whether peak_speed is from gust data (true) or sustained wind (false)
            sustained_speed:
              type:
              - number
              - 'null'
              description: |
                Peak sustained wind for the day (mph imperial, m/s metric), independent of gust. Equals peak_speed when is_gust is false. Use this for sustained-vs-sustained comparison against providers whose daily wind is sustained (e.g. NWS). Omitted when no sustained-wind ensemble was available.
        storm_orientation:
          type:
          - string
          - 'null'
          enum:
          - right_side_up
          - upside_down
          - mixed
          - null
          description: |
            How SLR changes over a snow storm. Only present on days with 3+ hours of snowfall. right_side_up: dense→fluffy (stable, powder on top). upside_down: fluffy→dense (weak base, avalanche risk). mixed: no clear trend.
        storm_orientation_description:
          type:
          - string
          - 'null'
          description: |
            Plain-language companion to `storm_orientation`, suitable for direct display. Populated whenever `storm_orientation` is set — the pair is either both present or both absent. Example for upside_down: "Upside-down storm: fluffy snow fell first, denser snow on top. Weak base layer — elevated avalanche risk, heavier ski surface."
        astro:
          $ref: '#/components/schemas/DailyAstro'
        temperature_climatology:
          $ref: '#/components/schemas/DayClimatology'
    DailyAstro:
      type: object
      description: |
        The day's sun and moon, grouped (they were flat keys on the daily row, beside a zodiac sign that is no longer served).
      required:
      - moon_phase
      - moon_illumination
      - astronomical_season
      properties:
        sunrise:
          type:
          - string
          - 'null'
          format: date-time
          description: |
            Sunrise time at the forecast location, ISO-8601 UTC. Computed with the NOAA Solar Calculator algorithm including atmospheric refraction (-34′), solar semi-diameter (-16′), and elevation-induced horizon dip. Accurate to within ~1 minute of USNO reference values.
          example: '2026-04-18T13:24:00Z'
        sunset:
          type:
          - string
          - 'null'
          format: date-time
          description: |
            Sunset time at the forecast location, ISO-8601 UTC. For western- hemisphere locations in late-afternoon UTC, this often falls on the UTC calendar day *after* the local forecast date.
          example: '2026-04-19T03:02:00Z'
        moon_phase:
          type: string
          enum:
          - new_moon
          - waxing_crescent
          - first_quarter
          - waxing_gibbous
          - full_moon
          - waning_gibbous
          - last_quarter
          - waning_crescent
          description: Eight-way moon phase for the date.
          example: waxing_gibbous
        moon_illumination:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Fraction of the moon's disc that's illuminated (0.0 = new, 1.0 = full). More precise than the named phase — useful if the UI wants to render a crescent icon scaled to the exact illumination.
          example: 0.78
        astronomical_season:
          type: string
          enum:
          - spring
          - summer
          - autumn
          - winter
          description: |
            Astronomical season by equinox/solstice (not meteorological). Hemisphere-aware — a Southern-hemisphere location returns `summer` in January.
          example: spring
    DayClimatology:
      type: object
      description: |
        Served as a daily row's `temperature_climatology` (it was `climatology`, which did not name its variable). Seasonal temperature normal for this day at the forecast point (all-hours mean and standard deviation over a ±15-day window around the date), resolved the way verification resolves a station's reference: the nearest climatology station's own normal when one lies within 60 km, else the ERA5 0.25° cell the point lies in. Units follow the request's `units` parameter (°C metric, °F imperial). Omitted only outside the climatology grid or before the normals are loaded. `std` includes the diurnal range, so it is a wide, climate-scale spread — useful for bounding a forecast against the local climate, not for tight day-to-day comparison.
      required:
      - mean
      - std
      properties:
        mean:
          type: number
          format: double
          description: All-hours seasonal mean temperature.
          example: 18.4
        std:
          type: number
          format: double
          description: Seasonal standard deviation (includes the diurnal range).
          example: 6.5
    ElevationForecast:
      type: object
      description: |
        Forecast at one of a location's additional elevations (ski-area base / mid / summit). Each is a full point forecast built by the SAME pipeline as the primary `forecast` — grid assembly, snowfall derivation, NGR/CSGD correction, nowcast blend, conditions, feels-like, provenance, the daily windows and day totals, the snow outlook — at this elevation's coordinates (`lat`/`lon`) and elevation. Every model's 2 m temperature and dewpoint are first carried from the model's own terrain height to the primary's elevation (a diurnal climatological lapse at the local solar hour; dewpoint 2 °C/km), as for every served point; they are then carried from the primary's elevation by a lapse rate (the hour's own profile when it brackets the layer, else climatology; see `provenance.lapse_profile` / `lapse_climatology`), and the learned corrections are the primary's. Precipitation and snowfall are carried from the primary's elevation by the local PRISM precipitation–elevation regression (see `provenance.lapse_prism`). Wind and snow level are the forecast at those coordinates — no elevation multiplier is applied to them. The location's own point is never repeated here.
      required:
      - name
      - elevation
      - lat
      - lon
      properties:
        name:
          type: string
        elevation:
          type: number
        default:
          type: boolean
          description: Whether this is the default elevation to show in the UI
        lat:
          type: number
          description: Where this elevation was forecast — its own coordinates when the catalog has them,
            else the location's.
        lon:
          type: number
        timeseries:
          type: array
          description: |
            LEGACY compact hourly points, derived from `hourly` (kept for clients that read only these; new clients should read `hourly`). Each also carries the hour's `precipitation`, `condition` and `condition_icon` -- the same values as the `hourly` hour at that `valid_time`, so an hour's precipitation type (`snow_level_delta`) can be shown only when something is likely to fall. Omitted with `hourly=false`. Carries the same gaps as the primary `forecast.timeseries` — a refused hour is absent here too — so key on `valid_time`, not position.
          items:
            type: object
            properties:
              valid_time:
                type: string
                format: date-time
              lead_time_hours:
                type: integer
              temperature:
                $ref: '#/components/schemas/Quantiles'
              snow_level_delta:
                anyOf:
                - $ref: '#/components/schemas/Quantiles'
                - type: 'null'
                description: Elevation minus snow level (positive = above the snow level = snow expected;
                  negative = below it = rain)
              wind_speed:
                anyOf:
                - $ref: '#/components/schemas/Quantiles'
                - type: 'null'
                description: The variant's served wind speed (`hourly[].ensemble.wind_speed`)
              wind_gust:
                anyOf:
                - $ref: '#/components/schemas/Quantiles'
                - type: 'null'
                description: The variant's served gust (`hourly[].ensemble.wind_gust`); absent at lead
                  0, as on the primary
              precipitation:
                allOf:
                - $ref: '#/components/schemas/Quantiles'
                description: |
                  The variant's served hourly precipitation (`hourly[].ensemble.precipitation`), the same shape as the primary's, including the occurrence `probability`. Prefer `p50` (or `probability`) over `mean` for display.
              condition:
                type: string
                description: |
                  The machine code, as `TimeSeriesPoint.condition`.
                example: sunny
              condition_text:
                type: string
                description: |
                  The variant's served condition (`hourly[].condition`), derived as for the primary's hour (see `TimeSeriesPoint.condition`): a dry hour above the snow level is a sky condition, not snow.
                example: Sunny
              condition_icon:
                type: string
                description: The variant's served icon hint (`hourly[].condition_icon`; see `TimeSeriesPoint.condition_icon`).
                example: sunny
            required:
            - valid_time
            - lead_time_hours
            - temperature
            - precipitation
            - condition
            - condition_text
            - condition_icon
        hourly:
          type: array
          description: |
            The full hourly series at this elevation — the same shape and the same code as `forecast.timeseries` (never with `model_means`). With `members=true` each hour carries THIS elevation's `members`: every member lapsed by the same per-hour offset as the headline temperature and dewpoint, its precipitation carried by the same PRISM ratio (over the hours its `precipitation_hours` span), and its snowfall derived by the member snowfall rule at this elevation; in the response's `members_view` (Free `plume` / Pro `full`). Same gap rule: key on `valid_time`. Omitted with `hourly=false`.
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
        daily:
          type: array
          description: Daily summaries at this elevation — the same daily build as `forecast.daily` (omitted
            when empty)
          items:
            $ref: '#/components/schemas/DailyForecast'
        snow_outlook:
          allOf:
          - $ref: '#/components/schemas/SnowOutlook'
          description: Rolling snow totals at this elevation, as `forecast.snow_outlook` (omitted when
            there are no dailies)
