            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `AttributionRegistry` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionRegistry'
              examples:
                abridged:
                  summary: One provider (abridged)
                  value:
                    providers:
                    - id: ecmwf
                      name: European Centre for Medium-Range Weather Forecasts (ECMWF)
                      credit: 'Contains modified ECMWF data: based on data and products of the European
                        Centre for Medium-Range Weather Forecasts (ECMWF), CC BY 4.0'
                      licence: CC-BY-4.0
                      licence_url: https://creativecommons.org/licenses/by/4.0/
                      terms_url: https://apps.ecmwf.int/datasets/licences/general/
                      modified: true
                      notices:
                      - This service is based on data and products of the European Centre for Medium-Range
                        Weather Forecasts (ECMWF).
                      sources:
                      - id: aifs
                        name: ECMWF AIFS ensemble (AIFS-ENS)
                        kind: model
                        provider: ecmwf
  /api/v1/runs:
    get:
      summary: List available model runs
      description: |
        The cycles a `?run=` (Pro) can pin -- init times at which at least two models completed, newest first -- and, in `served`, what a forecast request serves NOW. The two differ by design: a forecast is served from each model's own newest cycle (per-model-latest), and its `model_run.initialized_at` is the newest of those cycles -- `served.initialized_at` here -- while a `runs[]` entry is a single init that two models completed. So `runs[0]` can be 12Z while forecasts say 18Z (one model's 18Z cycle is in; a second has not finished it). **Optional auth / free tier:** works without credentials; budgeted per caller like every data route.
