  /api/v1/catalog/locations/{slug}:
    get:
      summary: (Beta) Get a CMS catalog location by slug
      x-beta: true
      description: |
        Full location detail — the catalog row plus nested elevations,
        photos, webcams, and nearby stations. Visibility matches the
        list endpoint: published rows outside the active coverage
        window return 404. Records a pageview
        (fire-and-forget) attributed via the `channel` param.

        A retired or renamed slug (a duplicate retired into the
        page it duplicated, or a slug change) answers 200 with the location
        it resolves to now; the body's `slug` is the canonical one, so a web
        page served under the old slug can redirect to or declare it as
        canonical. No 301 (see "Location Names").

        Opt-in extras via `?include=` (CSV): `content` (published
        content entries attached to this location, locale-resolved),
        `template` (the resolved page template), `ads` (resolved ad
        placements). Unknown `include` values are **ignored**, not
        rejected. Without `?include=` the response is byte-identical to
        the pre-Phase-3 shape. `ads` additionally requires the caller's
        tier to carry the `ads_enabled` entitlement — Free tier sees
        ads, Pro is ad-free — and the field is omitted entirely
        otherwise.
      operationId: getCatalogLocation
      tags:
      - Catalog
      security: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: mt-hood-meadows
      - name: include
        in: query
        schema:
          type: string
        example: content,template,ads
        description: |
          Comma-separated opt-in extras: `content`, `template`,
          `ads`. Unknown values are ignored.
      - name: locale
        in: query
        schema:
          type: string
          default: en
        example: es
        description: |
          BCP-47 locale for `content` resolution — translated fields
          overlay per field with English fallback
          (`resolved_locale` says what each entry actually resolved
          to). Malformed tags are a `400`.
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          description: |
            Location detail (plus the requested `?include=` extras when
            present).
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `CatalogEntry` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCatalogLocationDetail'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
