          type: string
          format: uuid
          description: Must reference an existing photo row.
    CatalogTemplateSummary:
      type: object
      description: |
        The resolved page template as the public API serves it —
        identity + scope + spec; editorial audit fields stay internal.
      required:
      - id
      - location_type
      - template_variant
      - spec
      properties:
        id:
          type: string
          format: uuid
        location_type:
          type:
          - string
          - 'null'
          description: Null = wildcard scope.
        template_variant:
          type:
          - string
          - 'null'
          description: Null = wildcard scope.
        spec:
          type: array
          items:
            $ref: '#/components/schemas/CmsTemplateSection'
    CatalogResolvedEntry:
      type: object
      description: |
        One published content entry as the public catalog detail serves
        it: entry fields + the attachment's slot/order + which locale
        the read path actually resolved. Draft/audit internals are
        deliberately absent.
      required:
      - id
      - content_type_key
      - title
      - body
      - slot
      - display_order
      - resolved_locale
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        content_type_key:
          type: string
          example: trail-report
        title:
          type: string
        body:
          type: object
          description: Shaped by the content type's `field_schema`.
        slot:
          type: string
          description: The template `content_slot` key this entry fills.
          example: overview
        display_order:
          type: integer
        resolved_locale:
          type: string
          description: |
            The requested locale if ANY field of this entry carried a
            translation, else the entry's base locale. Partial coverage
            overlays per field — that IS the fallback model.
          example: es
        updated_at:
          type: string
          format: date-time
    CatalogHousePlacement:
      type: object
      description: A resolved house placement (campaign + creative content).
      required:
      - campaign_id
      - creative_id
      - content
      properties:
        campaign_id:
          type: string
          format: uuid
        creative_id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/CmsAdCreativeContent'
    CatalogThirdPartyPlacement:
      type: object
      description: A resolved third-party placement (network config served verbatim).
      required:
      - unit_id
      - provider
      - config
      properties:
        unit_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - adsense
          - gam
          - custom
        config:
          type: object
    CatalogResolvedAdSlot:
      type: object
      description: |
        One filled ad slot as the public API serves it. Exactly one of
        `house` / `third_party` is present, discriminated by `kind`.
        Report impressions/clicks for it via `POST /api/v1/events/ad`.
      required:
      - slot_key
      - kind
      - sizes
      properties:
        slot_key:
          type: string
          example: forecast-footer
        kind:
          type: string
          enum:
          - house
          - third_party
        house:
          $ref: '#/components/schemas/CatalogHousePlacement'
          description: Present iff `kind = house`.
        third_party:
          $ref: '#/components/schemas/CatalogThirdPartyPlacement'
          description: Present iff `kind = third_party`.
        sizes:
          type: array
          description: The slot's client rendering hints (`default_sizes`).
          items:
            type: array
            items:
              type: integer
tags:
- name: Weather
  description: Current conditions, storm reports, and weather data
- name: Locations
  description: Location discovery
- name: Catalog
  description: Public CMS catalog reads (locations + stations, cursor-paginated, no auth)
- name: Forecasts
  description: Ensemble weather forecasts
