  /api/v1/attribution:
    get:
      summary: Data sources, licences and required notices
      description: |
        Every data source Ourea uses -- the forecast models, the
        benchmark peer, the observation networks, the climatology and the
        terrain -- grouped by provider, with the provider's credit line,
        licence (an SPDX id where one exists), licence URL, the terms page
        the wording was taken from, whether Ourea serves the data modified,
        and the statements the terms require shown in full.

        Each response that credits sources carries an `attribution` block
        whose `sources` are ids in this document and whose `credit` is the
        `credit` lines of their providers. Public (no credentials), static,
        `Cache-Control: public, max-age=86400`. The web `/attribution` page
        renders it.
      operationId: getAttribution
      tags:
      - Weather
      security: []
