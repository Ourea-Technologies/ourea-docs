  /api/v1/forecast:
    get:
      summary: Get forecast by coordinates (Pro)
      description: |
        The forecast at an arbitrary point — the same pipeline,
        calibration and response schema as
        `GET /api/v1/locations/{state}/{name}` (hourly `timeseries`,
        `daily`, snow outlook, `model_run`), plus a `point` block saying
        where it was computed. A coordinate forecast at a catalog
        location's point and elevation IS that location's forecast.

        **Pro only.** The caller's effective tier (API key's owner, or
        session user) must be Pro; Free and anonymous callers get
        `403 PRO_REQUIRED`. The tier gate runs before any validation.
        The per-key Pro rate budget applies.

        **Quantization.** `lat`/`lon` are rounded to the nearest 0.01°
        (~1.1 km) and the forecast is computed there; `point.lat` /
        `point.lon` are the served coordinates, `point.requested_*` the
        ones sent. Requests a few metres apart therefore get the same
        forecast. To reuse a cached response, send the quantized
        coordinates back.

        **Elevation.** `elevation_m` is optional. Given, it is used as
        sent and always wins (`point.elevation_source: request`). Omitted,
        the server reads the ground elevation from the USGS 3DEP 1/3
        arc-second (~10 m) DEM, interpolated bilinearly at the
        **quantized** point (`point.elevation_source: dem_3dep_10m`),
        precomputed for every 0.01° point of the coverage window. Only
        where the DEM has no value at the point (water, a void, or a
        server without the elevation grid) is the request refused with
        `400 ELEVATION_REQUIRED` — an elevation is never guessed. The
        elevation drives the temperature and dewpoint (each model's 2 m
        values are carried from the model's own terrain height to this
        elevation), the snow/rain phase, snowfall and the
        elevation-keyed calibration, so pass `elevation_m` when you need
        a specific elevation that is not the ground at the quantized point
        (a summit, a lift top, a building roof).

        **Coverage.** The point must lie inside the forecast coverage
        window and over land in a US state (the state's majority zone sets
        the local-day timezone of `daily`, and is `location.timezone`);
        otherwise `404 OUTSIDE_COVERAGE`.

        `location.name` is the quantized `"lat, lon"`, and `location.type`
        carries no meaning for a coordinate forecast. `?elevations=all` is
        ignored (one point).
      operationId: getPointForecast
      tags:
      - Forecasts
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
          example: 45.3311
        description: Latitude, decimal degrees (WGS84). Quantized to 0.01°.
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
          example: -121.7113
        description: Longitude, decimal degrees (WGS84, west negative). Quantized to 0.01°.
      - name: elevation_m
        in: query
        schema:
          type: number
          minimum: -500
          maximum: 9000
          example: 1829
        description: |
          Optional. Elevation of the point in metres above sea level (always metres, whatever `units` is), used as given. Omit it to use the 3DEP 10 m DEM elevation of the quantized point (`point.elevation_source: dem_3dep_10m`); a point where the DEM has no value then answers `400 ELEVATION_REQUIRED`.
      - name: max_hours
        in: query
        schema:
          type: integer
          minimum: 6
          maximum: 360
          default: 24
        description: |
          Hours of the hourly series past its first hour, clamped to the tier's outlook (Free 240, Pro 360). Counted from the CURRENT hour (the hour containing the request time), so `max_hours=48` returns that hour plus the next 48 -- 49 points; with `include_past=true` (or a pinned `run`) counted from the run's init, as before 2026-10-19. The series ends where the model run ends (lead 360), so near the cap fewer hours come back.
      - name: include_past
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Serve the hourly series from the model run's init, the hours already past included -- the behaviour before 2026-10-19, for research and verification. Default `false`: the series starts at the current hour. A pinned `run` is always served from its init. `daily` is identical either way; `snow_outlook` opens at the first served hour. A body served from init does not roll over at the hour boundary (see `nowcast`).
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: models
        in: query
        schema:
          type: boolean
          default: false
        description: Include per-model breakdowns.
      - name: members
        in: query
        schema:
          type: boolean
          default: false
        description: Include individual member values (`members_view` is `full`).
      - name: daily
        in: query
        schema:
          type: boolean
          default: true
        description: Include daily summaries (horizon `max_days`, never `max_hours`).
      - name: max_days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 15
        description: |
          As on the location forecast: the run's first `max_days` local dates; default the full horizon (15 for Pro).
        example: 7
      - name: hourly
        in: query
        schema:
          type: boolean
          default: true
        description: |
          As on the location forecast: `false` omits `timeseries` and serves the dailies alone.
      - name: run
        in: query
        schema:
          type: string
          format: date-time
        description: Specific init time for historical queries.
      - name: sources
        in: query
        schema:
          type: string
        description: As on the location forecast.
      - name: exclude_sources
        in: query
        schema:
          type: string
        description: As on the location forecast.
      - name: nowcast
        in: query
        schema:
          type: boolean
          default: true
        description: |
          As on the location forecast. Every caller here is identified (Pro), so either layer is served with an `ETag` and `Cache-Control: private, max-age=0`: a tier-shaped body is never shared-cacheable. A matching `If-None-Match` is `304`.
      - $ref: '#/components/parameters/Prob'
      - $ref: '#/components/parameters/Totals'
      - $ref: '#/components/parameters/Diagnostics'
      - $ref: '#/components/parameters/Format'
      - $ref: '#/components/parameters/FeelsLike'
      responses:
        '200':
          description: Forecast at the quantized point.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Link:
              schema:
                type: string
              description: |
                `</api/v1/attribution>; rel="license"`: the data-source credits, licences and required notices this response's `attribution` block refers to.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ForecastResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
              examples:
                point:
                  summary: The `point` block (other fields as the location forecast)
                  value:
                    location:
                      name: 45.33, -121.71
                      lat: 45.33
                      lon: -121.71
                      elevation: 1829.0
                      type: cityTown
                    point:
                      requested_lat: 45.3311
                      requested_lon: -121.7113
                      lat: 45.33
                      lon: -121.71
                      resolution_deg: 0.01
                      elevation: 1829.0
                      elevation_source: request
                      state: OR
                    nowcast_applied: true
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: |
            `INVALID_COORDINATES` (lat/lon missing, not a finite number, or out of range), `INVALID_ELEVATION` (`elevation_m` not a finite number in [-500, 9000]), `ELEVATION_REQUIRED` (no `elevation_m`, and the 3DEP DEM has no value at the quantized point -- water, a void, or a server without the elevation grid), `BAD_REQUEST` (`hourly=false&daily=false`: nothing to serve; a `feels_like` name that is no index), or `FEELS_LIKE_UNAVAILABLE` (`feels_like=utci`, not served yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    error: INVALID_COORDINATES
                    message: '`lat` must be a finite number in [-90, 90], got ''91'''
                elevationRequired:
                  value:
                    error: ELEVATION_REQUIRED
                    message: no terrain elevation is available for (45.33, -121.71) on this server; pass
                      `elevation_m` (metres above sea level)
        '403':
          description: The caller's effective tier is not Pro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PRO_REQUIRED
                message: Forecasts by coordinates require a Pro subscription; authenticate with a Pro
                  API key or session
        '404':
          description: |
            `OUTSIDE_COVERAGE`: the quantized point is outside the forecast coverage window, or over no US state (offshore).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: OUTSIDE_COVERAGE
                message: (51.5, -0.1) is outside the forecast coverage window (lat 24..50, lon -125..-66)
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
        '503':
          description: '`FORECAST_UNAVAILABLE`: no servable cycle covers the point.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maps/token:
    get:
      summary: Token for the Pro map layers (Pro)
      description: |
        A short-lived token for the Pro layers of the Forecast Map
        at `https://maps.oureawx.com` -- every individual model layer
        (RRFS, GEFS, IFS ENS, AIFS, AIGEFS: manifests and frames, every
        lead) and the Ourea Blend past 240 h. The Blend to 240 h, the radar
        layer (MRMS reflectivity, `radar/manifest.json` and every
        scan), the variable registry and `index.json` (every layer with its
        `entitlement`, `free` or `pro`) are free and need no token.

        Present it to the maps origin under `/pro/` -- the same object path
        with `/pro` in front, e.g. `/pro/gefs/manifest.json` -- as
        `Authorization: Bearer <token>`. The maps origin answers a free
        path to a Pro object `403`, and a `/pro/` request with a missing,
        expired or forged token `401`.

        **Pro only.** The caller's effective tier (API key's owner, or
        session user) must be Pro; Free and anonymous callers get
        `403 PRO_REQUIRED`. Each call spends one request of the caller's
        data budget (`RateLimit-*`). The token lives 15 minutes
        (`expires_at`, Unix seconds): fetch a new one shortly before it
        expires, not per frame. Never cacheable (`Cache-Control: no-store`).

        `404` when this server has no Pro map token key configured.
      operationId: getMapsToken
      tags:
      - Weather
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      responses:
        '200':
          description: A token for the maps origin's `/pro/` path.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - expires_at
                - prefix
                properties:
                  token:
                    type: string
                    description: |
                      Opaque. Send as `Authorization: Bearer <token>` to the maps origin.
                  expires_at:
                    type: integer
                    format: int64
                    description: When the token stops working, Unix seconds (at most 15 minutes after
                      issue).
                  prefix:
                    type: string
                    description: The maps-origin path prefix the token opens.
                    example: /pro/
              example:
                token: eyJzdWIiOiJ1c2VyOjdkNmMxYjllLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMSIsImV4cCI6MTc2MTQzNzcwMCwicHJlZml4IjoiL3Byby8ifQ.3JYH0o2B3k4m3m2Dq0v8yq6m3o2Vv3Q7cK0a3c6sYxU
                expires_at: 1761437700
                prefix: /pro/
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          description: The caller's effective tier is not Pro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PRO_REQUIRED
                message: Maps past 10 days and the individual model layers require a Pro subscription;
                  authenticate with a Pro session or API key
        '404':
          description: No Pro map token key is configured on this server (error NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/locations/{state}/{name}/current:
    get:
      summary: Current conditions from nearest sensors
      operationId: getCurrentConditions
      description: |
        Returns latest observation data from sensors within 25km of the location. Includes sensor-type-specific fields: SNOTEL (SWE, snow depth, percent of median), METAR (pressure, visibility), RWIS (pavement temp, road condition), AgriMet (solar radiation). Only includes observations from the last 3 hours. **Optional auth / free tier:** works without credentials; unauthenticated requests are rate-limited per IP (HTTP 429 with Retry-After).
      tags:
      - Weather
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: State (e.g., "oregon", "washington", or "california")
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: |
          Location slug (e.g., "mt-hood-meadows"); an airport's FAA code or
          the legacy camelCase name resolve as aliases, and a retired or
          renamed slug resolves to its canonical location.
      - name: sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated allowlist of observation sources to include. Overrides defaults when present. Example: `snotel,ski_resort`.
      - name: exclude_sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated denylist, unioned with the built-in deny set (cocorahs / usgs / ndbc / rawinsonde).
      - name: units
        in: query
        schema:
          type: string
          enum:
          - metric
          - imperial
          - kelvin
          default: metric
        description: Unit system for the `nowcast_hours` band and `current` block values.
      - $ref: '#/components/parameters/Format'
      - name: include
        in: query
        schema:
          type: string
          enum:
          - nowcast_hours
        description: |
          Opt-in sections, comma-separated. `nowcast_hours` adds the obs-blended band (for clients overlaying it on a cached `nowcast=false` forecast). An unknown name is a 400.
      responses:
        '200':
          description: |
            Current sensor observations plus the Layer-B overlay: `nowcast_hours` carries the obs-blended forecast hours whose valid times fall in [now − 1h, now + 10h] (same shape as the forecast `timeseries` points; null when no cycle is servable), `as_of` is the overlay timestamp, and `model_run_initialized_at` identifies the underlying run so clients can detect a cycle rollover and refetch the cached base forecast. Merge contract: for valid times present in `nowcast_hours`, this band WINS over a cached `?nowcast=false` base response. An anonymous caller gets `Cache-Control: public, max-age=0, s-maxage=30, stale-while-revalidate=15` (well inside the ~2 min alert refresh), a caller with an API key or session `private, max-age=0`; the `ETag` digests the content (all but `as_of`), and a matching `If-None-Match` is `304`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Link:
              schema:
                type: string
              description: |
                `</api/v1/attribution>; rel="license"`: the data-source credits, licences and required notices this response's `attribution` block refers to.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `CurrentObservationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
        '503':
          description: |
            Forecast unavailable. Also returned (`FORECAST_UNAVAILABLE`) when no forecast hour has a complete set of core variables — the system says it cannot serve the location rather than returning an envelope wrapped around an empty `timeseries`.
  /api/v1/locations/{state}/{name}/alerts:
    get:
      summary: Active NWS alerts for a location
      operationId: getLocationAlerts
      description: |
        Active NWS watches, warnings, and advisories affecting the location, matched by NWS public-forecast/county zone (western winter products are issued on terrain-based forecast zones) and by warning polygon for convective products. Served `Cache-Control: private, no-cache` with an `ETag` on the alerts (it was `no-store`): safety data never sits in a shared cache and is revalidated on every request, but a poll of unchanged alerts is a `304` with no body. Ingested upstream every ~2 minutes; the same array also appears on `…/current`. **Optional auth / free tier:** works without credentials; unauthenticated requests are rate-limited per IP.
      tags:
      - Weather
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code path segment (e.g., "or", "nc")
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Location slug (e.g., "government-camp", "asheville")
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Active alerts (possibly empty) for the location.
          headers:
