            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Link:
              schema:
                type: string
              description: |
                `</api/v1/attribution>; rel="license"`: the data-source credits, licences and required notices this response's `attribution` block refers to.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `AlertsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
        '301':
