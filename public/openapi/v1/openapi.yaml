# Do not edit: change the main spec (or the generator) and re-run it.
openapi: 3.1.0
info:
  title: Ourea Weather API (public)
  version: 1.0.0
  description: |
    Ensemble weather forecasts for the contiguous United States, blended from
    up to five weather models per forecast hour (ECMWF AIFS-ENS and IFS-ENS,
    NOAA AIGEFS, GEFS and RRFS), with every hour's full distribution served
    beside its headline numbers.

    ## Authentication
    Send an API key in the `X-API-Key` header. Forecast, current-conditions and
    alert routes also answer without credentials at the Free tier (10-day
    horizon, latest run only, members as the plume view). Forecasts at
    arbitrary coordinates (`GET /api/v1/forecast`) require Pro. The catalog and
    search routes need no credentials.

    ## Rate limits
    Every route here is budgeted per caller: per account or API key, or per
    client address without credentials. A token bucket (a burst, refilled at a
    sustained per-minute rate), a daily quota, and an hourly budget of catalog
    rows (list pages and search hits) apply, larger for Pro than for Free or
    anonymous callers. Every response carries `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset` and `RateLimit-Policy`, except
    one a shared cache may store (`Cache-Control` `public` or `s-maxage`,
    such as an anonymous forecast or list), which carries none; over a
    budget is `429` with `Retry-After`. Without credentials or on Free, list
    pages are capped (a state list without `limit` is the first page, with
    `next_cursor`), and a caller reading very many distinct locations in an
    hour, or walking the catalog in order, is slowed for an hour. Read the
    headers rather than hard-coding numbers; for bulk access, contact us.

    ## Units
    `units=metric` (default): Celsius, mm, m/s, meters.
    `units=imperial`: Fahrenheit, inches, mph, feet.

    ## Locations
    A location is addressed by state (USPS code or name) and slug:
    `/api/v1/locations/or/mt-hood-meadows`. Use the search and catalog routes
    to find slugs.

    ## The hourly series starts now
    A forecast's hourly `timeseries` starts at the hour containing the request
    time and `max_hours` counts forward from it: `max_hours=48` is the current
    hour plus the next 48. `include_past=true` serves the series from the model
    run's init instead, the hours already past included. The `daily` rows cover
    whole local days either way, in the location's IANA `timezone`
    (`location.timezone`).

    ## Versioning
    v1 changes only additively: ignore unknown fields and treat unknown enum
    values as "other"; breaking changes go to `/api/v2`. A deprecated field,
    parameter or route is announced at least six months ahead, and responses
    using it carry `Deprecation`, `Sunset` and a `Link` with
    `rel="deprecation"`. `info.version` is the contract version (1.0.0 at the
    v1 lock).

    ## Behaviour changes
    - 2026-10-19: the hourly series starts at the current hour instead of the
      model run's init, and `max_hours` counts from it; `include_past=true`
      restores the old window. Locations carry their IANA `timezone`.

    ## Data sources and attribution
    Forecast, current-conditions and alert responses carry an `attribution`
    block naming exactly the data sources that response drew on, one credit
    line per provider, and the path of the full notices; they also send
    `Link: </api/v1/attribution>; rel="license"`. `GET /api/v1/attribution`
    (no credentials) lists every source with its provider's licence, terms
    page and required statements. ECMWF data are CC BY 4.0 and served
    modified: if you redistribute Ourea output, carry `attribution.credit`
    with it.
  contact:
    name: Ourea Weather
  license:
    name: Proprietary
servers:
- url: https://api.oureawx.com
security:
- apiKey: []
- sessionCookie: []
- sessionBearer: []
paths:
  /api/v1/locations:
    get:
      summary: List every forecast location (all states + sensors), one page at a time
      description: |
        Walks every location in the catalog — public points from the
        every state's catalog (CONUS-wide) plus every observation-network sensor
        site — in slug-ordered pages. Filter by category with `type=`.
        This list is always paged; the first call returns the
        first `limit` rows (default and maximum 5000; at most 500
        for anonymous and 1000 for Free callers) and a `next_cursor` to
        pass back as `cursor`. Pages draw on the caller's hourly
        catalog-row budget (see "Rate limiting"), so a full walk of the
        ~450k-row catalog is not an anonymous or Free operation; for
        lookup use `/api/v1/search/locations`.
      operationId: getAllLocations
      tags:
      - Locations
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      - {}
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: limit
        in: query
        description: |
          Page size (1–5000); defaults to 5000 on this route
          (the all-states list is never returned whole — it is ~450k
          rows / 116 MB). Capped at 500 for anonymous and 1000
          for Free callers. Pages are ordered by slug; `next_cursor` in
          the response is the slug to pass back as `cursor` for the
          following page, with the same `limit` and `type` filter. The
          last page carries no `next_cursor`.
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: cursor
        in: query
        description: The `next_cursor` from the previous page.
        schema:
          type: string
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: One slug-ordered page of the location catalog; `next_cursor` is absent on the last
            page
          headers:
            Cache-Control:
              $ref: '#/components/headers/ListCacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ListLocationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/locations/{state}:
    get:
      summary: List forecast locations for a state
      operationId: getLocations
      tags:
      - Locations
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
          example: co
        description: |
          Any US state or DC, as its two-letter USPS code (`co`, `NY`) or
          its name with spaces optional (`colorado`, `New York`), case-
          insensitive. Locations are served CONUS-wide; a state
          with no onboarded locations answers 404 with "No locations
          onboarded in X yet", an unknown segment 404s with "State 'X' not
          recognized".
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: limit
        in: query
        description: |
          Page size (1–5000). Absent: the whole state for a Pro
          caller; an anonymous or Free caller gets one page of
          its class's largest page (500 / 1000) with `next_cursor` —
          asking for more does not raise that cap. Pages are ordered by slug; `next_cursor` in
          the response is the slug to pass back as `cursor` for the
          following page, with the same `limit` and `type` filter. The
          last page carries no `next_cursor`.
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: cursor
        in: query
        description: The `next_cursor` from the previous page.
        schema:
          type: string
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Location list, or one page of it when `limit` is given or the caller is anonymous
            or Free
          headers:
            Cache-Control:
              $ref: '#/components/headers/ListCacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ListLocationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/locations/{state}/{name}:
    get:
      summary: Get location forecast
      description: |
        Returns ensemble forecast with hourly timeseries and daily summaries.

        **The hourly series starts at the current hour.** `forecast.timeseries` begins at the hour containing
        the request time and runs `max_hours` past it (as far as the model
        run reaches); `include_past=true` serves it from the run's init. The
        `daily` rows cover whole local days either way.

        `{name}` is the location's catalog slug, dash-separated
        (`timberline-lodge`, `mt-hood-meadows`), as every response serves it;
        an airport's FAA code (`pdx`, `eug`) and the legacy camelCase name
        (`mtHoodMeadows`) still resolve as aliases, as do retired and renamed
        slugs, which answer with their canonical location (see "Location
        Names").

        **Optional auth / free tier:** this route works without credentials.
        Unauthenticated requests are served at the Free tier: 10-day horizon
        (240 h max), latest run only, no per-model data, and members as the
        plume view (`?members=true`: temperature, precipitation, snow level,
        snowfall). Authenticated Pro users receive the full 15-day
        horizon (360 h), per-model breakdowns (`?models=true`), and every
        member variable (`?members=true`). Unauthenticated requests are rate-limited per IP
        (HTTP 429 with `Retry-After` header when the window is exceeded).

        **Ensemble plumes.** One request carries every model's
        members for every hour:
        `?members=true&max_hours=240&daily=false&nowcast=false&units=imperial`
        (keep this parameter order: the edge cache keys on the exact URL;
        `max_hours` defaults to 24 and is clamped to the tier). Each
        `forecast.timeseries[]` hour carries `members`, keyed by model; a
        member is `(model, member_id)`. A member's `precipitation` and
        `snowfall` are the totals over the `precipitation_hours` hours
        ending at `valid_time` (the 6-hourly models have values at every
        6th hour only). Each member carries its running totals
        (`cumulative_precipitation`, `cumulative_snowfall`) over the served
        window -- the same window as `snow_outlook` -- and the synoptic
        hours carry their distribution (`members_cumulative`):
        clients draw these served fields and compute nothing. Members are
        at `location.elevation` (and on each served `elevation_forecasts[]`
        entry at its elevation). The headline total is the blend's
        mean, served as `snow_outlook`, not the members' mean; a
        served headline running total is to come.
      operationId: getLocationForecast
      tags:
      - Forecasts
      security:
      - apiKey: []
      - sessionCookie: []
      - sessionBearer: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
          example: co
        description: |
          Any US state or DC, as its two-letter USPS code (`co`, `NY`) or
          its name with spaces optional (`colorado`, `New York`), case-
          insensitive. Locations are served CONUS-wide; a state
          with no onboarded locations answers 404 with "No locations
          onboarded in X yet", an unknown segment 404s with "State 'X' not
          recognized".
      - name: name
        in: path
        required: true
        schema:
          type: string
        examples:
          skiArea:
            value: mt-hood-meadows
            summary: Mt Hood Meadows
          pass:
            value: santiam-pass
            summary: Santiam Pass
          airportCode:
            value: pdx
            summary: Portland International Airport, by its FAA code (an alias)
          legacyName:
            value: mtHoodMeadows
            summary: Mt Hood Meadows, by its legacy camelCase name (an alias)
      - name: max_hours
        in: query
        schema:
          type: integer
          minimum: 6
          maximum: 360
          default: 24
        description: |
          Hours of the hourly series past its first hour, clamped to the tier's outlook (Free 240, Pro 360). Counted from the CURRENT hour (the hour containing the request time), so `max_hours=48` returns that hour plus the next 48 -- 49 points; with `include_past=true` (or a pinned `run`) counted from the run's init, as before 2026-10-19. The series ends where the model run ends (lead 360), so near the cap fewer hours come back.
      - name: include_past
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Serve the hourly series from the model run's init, the hours already past included -- the behaviour before 2026-10-19, for research and verification. Default `false`: the series starts at the current hour. A pinned `run` is always served from its init. `daily` is identical either way; `snow_outlook` opens at the first served hour. A body served from init does not roll over at the hour boundary (see `nowcast`).
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: models
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Include per-model breakdowns. Pro: a Free caller (anonymous or a Free key) asking for it gets `403 PRO_REQUIRED` (it used to be ignored).
      - name: members
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Include individual member values. Free callers receive the plume view (temperature, precipitation + `precipitation_hours`, snow level, snowfall); Pro receives every member variable. The response's `members_view` says which. Members ride on the hourly series (none with `hourly=false`) at the location's primary elevation, and on each served `elevation_forecasts[].hourly` at that elevation, lapsed and PRISM-carried there as its headline is; for a plume ask for the whole horizon (`max_hours=240`, Pro `360`). Every member carries its running totals (`cumulative_precipitation`, `cumulative_snowfall`) over the served window, and the synoptic hours carry their distribution (`members_cumulative`), in both views. With `nowcast=false` the plume is the cacheable base layer: `Cache-Control` runs to the next expected model cycle (or the hour boundary), under a strong ETag naming the served cycles, the representation and the tier (304 on `If-None-Match`).
      - name: elevations
        in: query
        schema:
          type: string
        examples:
          all:
            value: all
          one:
            summary: one named elevation
            value: summit
          several:
            value: base,summit
        description: |
          Include elevation forecasts (ski areas) in `elevation_forecasts`: `all` for every extra elevation, or a comma-separated list of the location's elevation names (`location.elevations[].name`; case, `-`, `_` and spaces ignored) for just those. Naming the primary's own elevation adds no entry (its forecast is `forecast`). A name the location does not have is a 400 listing its names. Each served elevation is a full point forecast, so this costs roughly one extra forecast build per elevation -- and with `members=true` one extra plume each, which is why a client drawing one elevation's plume should name it.
      - name: daily
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Include daily summaries. Their horizon is `max_days`, never `max_hours` (see `DailyForecast`).
      - name: max_days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 15
        description: |
          The number of `daily` rows — the model run's first `max_days` LOCAL dates, starting at the local date of forecast hour 1 — independent of `max_hours`. Default: the tier's full horizon (Free 10, Pro 15). Clamped to `1..=` that horizon, as `max_hours` is clamped to the tier's outlook. Fewer rows come back only when the model run ends first (a date is served once the run reaches 23:00 local on it; see `DailyForecast`). Ignored with `daily=false`.
        example: 7
      - name: hourly
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Include the hourly `timeseries` (and each `elevation_forecasts[]` entry's `timeseries`/`hourly`). `false` serves the daily summaries alone: the keys are omitted, the hourly points are never computed, `max_hours` is ignored and `forecast.max_hours` is `0`. `daily`, `snow_outlook` and every other field are exactly what the same request with `hourly=true` returns, except `current`, which is read off the served hours and is therefore omitted. For daily-only consumers this is the cheap request: `hourly=false&max_days=7` is a fraction of the payload of `max_hours=168`. `hourly=false&daily=false` is a 400.
      - name: run
        in: query
        schema:
          type: string
          format: date-time
        description: |
          Specific init time for historical queries. A pinned run's hourly series is served from its init (as with `include_past=true`). Pro: a Free caller asking for it gets `403 PRO_REQUIRED` (it used to be ignored, serving the latest run).
      - name: sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated allowlist of observation sources used for the nowcast blend and `nearest_sensors`. Overrides the built-in per-variable allowlist when present. Example: `snotel,ski_resort`. Valid sources: agrimet, agweathernet, cdec, cimis, cocorahs, coop, ndbc, nws, raws, rawinsonde, rwis, ski_resort, snotel, tempest, usgs, wsdot.
      - name: exclude_sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated denylist, unioned with the built-in deny set (cocorahs / usgs / ndbc / rawinsonde — none carry a useful sub-hourly surface temperature). Example: `raws`.
      - name: nowcast
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Layer selector. `true` (default) = the merged legacy shape: hours 0–6 are blended with live observations, today's daily range is obs-clamped, gap-flow / nearest_sensors / overnight snow are populated. In those hours `precipitation` mixes the forecast with what the MRMS surface rain rate (a ~10 km neighbourhood mean) predicts for each hour's total: the radar's weight is full for the hour of the scan and falls to about half an hour later and an eighth by +6 h (a rate is never served as an hour's total). The hour in progress and the hour just ended read the rain the radar has already MEASURED where MRMS has published it: the radar-only 15-minute accumulations so far, plus the rate for the rest of the hour, or the whole past hour's accumulation. Time-varying, so its shared-cache TTL is short: an anonymous caller gets `Cache-Control: public, max-age=0, s-maxage=60, stale-while-revalidate=30` and an `ETag` that also digests the body (it was `no-store`). `false` = the PURE base forecast (Layer A): deterministic for the life of the served cycle, no live observation layers (`nowcast_applied: false`, `nearest_sensors` empty, no gap_flow, no overnight snow outlook), with an `ETag` naming the served cycle (the reference init and every model's own cycle), the binary version and a digest of the representation (the effective `max_hours`, `hourly`, `daily`/`max_days`, `units`, `models`, `members`, `elevations`, `run`, sources, the point and the caller's tier). An anonymous caller (always Free) gets `Cache-Control: public, max-age=0, s-maxage=N, stale-while-revalidate=300`, N running until the next expected cycle (at least 300 s, at most 3600 s), and `Vary: Authorization, X-API-Key, Cookie`. On either layer a caller identified by API key or session gets `Cache-Control: private, max-age=0` — the same URL is a different body per tier (the `max_hours`/`max_days` clamps, models, members), so no shared cache may hold it. Every ETag answers a matching `If-None-Match` with `304`. A body whose hourly series starts at the current hour (the default) is current only until the next hour boundary: on both layers its `s-maxage` ends there (below the 300 s floor if need be) and so does its `stale-while-revalidate`, and the base layer's `ETag` also names the first served hour, so a cache never serves a past hour as the first. With `include_past=true`, a pinned `run` or `hourly=false` nothing rolls at the hour. Clients using `nowcast=false` overlay the `nowcast_hours` band from `…/current?include=nowcast_hours` for valid times it covers. The default is `true`, permanently.
      - $ref: '#/components/parameters/Prob'
      - $ref: '#/components/parameters/Totals'
      - $ref: '#/components/parameters/Diagnostics'
      - $ref: '#/components/parameters/Format'
      - $ref: '#/components/parameters/FeelsLike'
      responses:
        '200':
          description: |
            Forecast data, with `ETag` and `Cache-Control` per layer and caller class (see the `nowcast` parameter): `public` with a shared TTL for an anonymous caller, `private, max-age=0` for an API key or session.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
            Link:
              schema:
                type: string
              description: |
                `</api/v1/attribution>; rel="license"`: the data-source credits, licences and required notices this response's `attribution` block refers to.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  , with `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ForecastResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
              examples:
                dailyOnly:
                  summary: '`?hourly=false&max_days=2` — daily summaries alone (abridged)'
                  value:
                    location:
                      name: Portland International Airport
                      lat: 45.5887
                      lon: -122.5975
                      elevation: 12.0
                      type: airport
                    model_run:
                      initialized_at: '2026-10-05T00:00:00Z'
                      total_members: 160
                    units: metric
                    forecast:
                      max_hours: 0
                      interval_hours: 1
                      daily:
                      - date: '2026-10-04'
                        condition: Mostly Cloudy
                      - date: '2026-10-05'
                        condition: Chance Showers
                      snow_outlook:
                        next_24h: 0.0
                        next_48h: 0.0
                        next_7d: 0.0
                    nowcast_applied: true
                plumes:
                  summary: '`?members=true&max_hours=240&daily=false&nowcast=false&units=imperial` — the
                    plume view (abridged: one hour, two members per model; `members_cumulative` is over
                    every member)'
                  value:
                    location:
                      name: Mt Hood Meadows
                      lat: 45.3311
                      lon: -121.6649
                      elevation: 5320.0
                      type: skiArea
                    model_run:
                      initialized_at: '2026-10-14T12:00:00Z'
                      total_members: 164
                      models:
                      - id: aifs
                        cycle: '2026-10-14T06:00:00Z'
                        members: 51
                      - id: aigefs
                        cycle: '2026-10-14T06:00:00Z'
                        members: 31
                      - id: gefs
                        cycle: '2026-10-14T06:00:00Z'
                        members: 31
                      - id: ifs_ens
                        cycle: '2026-10-14T00:00:00Z'
                        members: 50
                      - id: rrfs
                        cycle: '2026-10-14T12:00:00Z'
                        members: 1
                    units: imperial
                    members_view: plume
                    forecast:
                      max_hours: 240
                      interval_hours: 1
                      timeseries:
                      - valid_time: '2026-10-14T18:00:00Z'
                        lead_time_hours: 6
                        members:
                        - id: aifs
                          members:
                          - member_id: 0
                            temperature: 29.8
                            precipitation: 0.21
                            precipitation_hours: 6
                            wind_speed: null
                            wind_direction: null
