  /api/v1/catalog/locations/{slug}:
    get:
      summary: (Beta) Get a CMS catalog location by slug
      x-beta: true
      description: |
        Full location detail -- the catalog row plus its elevations,
        photos, webcams and nearby stations. Visibility matches the list
        endpoint: a location outside the forecast coverage window is a
        404. A retired slug (a merged duplicate, or a slug change) answers
        200 with the location
