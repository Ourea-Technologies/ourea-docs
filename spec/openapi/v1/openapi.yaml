  /api/v1/forecast:
    get:
      summary: Get forecast by coordinates (Pro)
      description: |
        The forecast at an arbitrary point — the same pipeline,
        calibration and response schema as
        `GET /api/v1/locations/{state}/{slug}` (hourly `timeseries`,
        `daily`, snow outlook, `model_run`), plus a `point` block saying
        where it was computed. A coordinate forecast at a catalog
        location's point and elevation IS that location's forecast.

        **Pro only.** The caller's effective tier (API key's owner, or
        session user) must be Pro; Free and anonymous callers get
        `403 PRO_REQUIRED`. The tier gate runs before any validation.
        The per-key Pro rate budget applies.

        **Quantization.** `lat`/`lon` are rounded to the nearest 0.01°
        (~1.1 km) and the forecast is computed there; `point.lat` /
        `point.lon` are the served coordinates, `point.requested_*` the
        ones sent. Requests a few metres apart therefore get the same
        forecast. To reuse a cached response, send the quantized
        coordinates back.

        **Elevation.** `elevation_m` is optional. Given, it is used as
        sent and always wins (`point.elevation_source: request`). Omitted,
        the server reads the ground elevation from the USGS 3DEP 1/3
        arc-second (~10 m) DEM, interpolated bilinearly at the
        **quantized** point (`point.elevation_source: dem_3dep_10m`),
        precomputed for every 0.01° point of the coverage window. Only
        where the DEM has no value at the point (water, a void, or a
        server without the elevation grid) is the request refused with
        `400 ELEVATION_REQUIRED` — an elevation is never guessed. The
        elevation drives the temperature and dewpoint (each model's 2 m
        values are carried from the model's own terrain height to this
        elevation), the snow/rain phase, snowfall and the
        elevation-keyed calibration, so pass `elevation_m` when you need
        a specific elevation that is not the ground at the quantized point
        (a summit, a lift top, a building roof).

        **Coverage.** The point must lie inside the forecast coverage
        window and over land in a US state (the state's majority zone sets
        the local-day timezone of `daily`, and is `location.timezone`);
        otherwise `404 OUTSIDE_COVERAGE`.

        **Privacy.** The forecast is computed at the point
        quantized to 0.01° (~1 km), and the elevation model is read there,
        so an app loses nothing by rounding a device's coordinates to 2
        decimals before sending them -- do. The server's logs record the
        request path and a few option parameters, never the coordinates.

        `location.name` is the quantized `"lat, lon"`, and `location.slug`
        and `location.type` are `null`: a point names no catalog place. `?elevations=all` is ignored (one point).
      operationId: getPointForecast
      tags:
      - Forecasts
      security:
      - apiKey: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
          example: 45.3311
        description: Latitude, decimal degrees (WGS84). Quantized to 0.01°.
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
          example: -121.7113
        description: Longitude, decimal degrees (WGS84, west negative). Quantized to 0.01°.
      - name: elevation_m
        in: query
        schema:
          type: number
          minimum: -500
          maximum: 9000
          example: 1829
        description: |
          Optional. Elevation of the point in metres above sea level (always metres, whatever `units` is), used as given. Omit it to use the 3DEP 10 m DEM elevation of the quantized point (`point.elevation_source: dem_3dep_10m`); a point where the DEM has no value then answers `400 ELEVATION_REQUIRED`.
      - name: max_hours
        in: query
        schema:
          type: integer
          minimum: 6
          maximum: 360
          default: 24
        description: |
          Hours of the hourly series past its first hour, clamped to the tier's outlook (Free 240, Pro 360). Counted from the CURRENT hour (the hour containing the request time), so `max_hours=48` returns that hour plus the next 48 -- 49 points; with `include_past=true` (or a pinned `run`) counted from the run's init. The series ends where the model run ends (lead 360), so near the cap fewer hours come back.
      - name: include_past
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Serve the hourly series from the model run's init, the hours already past included, for research and verification. Default `false`: the series starts at the current hour. A pinned `run` is always served from its init. `daily` is identical either way; `snow_outlook` opens at the first served hour. A body served from init does not roll over at the hour boundary (see `nowcast`).
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: models
        in: query
        schema:
          type: boolean
          default: false
        description: Include per-model breakdowns.
      - name: members
        in: query
        schema:
          type: boolean
          default: false
        description: Include individual member values (`members_view` is `full`).
      - name: daily
        in: query
        schema:
          type: boolean
          default: true
        description: Include daily summaries (horizon `max_days`, never `max_hours`).
      - name: max_days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 15
        description: |
          As on the location forecast: the run's first `max_days` local dates; default the full horizon (15 for Pro).
        example: 7
      - name: hourly
        in: query
