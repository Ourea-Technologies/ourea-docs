  /api/v1/maps/token:
    get:
      summary: Token for the Pro map layers (Pro)
      description: |
        A short-lived token for the Pro layers of the Forecast Map
        at `https://maps.oureawx.com` -- every individual model layer
        (RRFS, GEFS, IFS ENS, AIFS, AIGEFS: manifests and frames, every
        lead) and the Ourea Blend past 240 h. The Blend to 240 h, the radar
        layer (MRMS reflectivity, `radar/manifest.json` and every
        scan), the variable registry and `index.json` (every layer with its
        `entitlement`, `free` or `pro`) are free and need no token.

        Present it to the maps origin under `/pro/` -- the same object path
        with `/pro` in front, e.g. `/pro/gefs/manifest.json` -- as
        `Authorization: Bearer <token>`. The maps origin answers a free
        path to a Pro object `403`, and a `/pro/` request with a missing,
        expired or forged token `401`.

        **Pro only.** The caller's effective tier (API key's owner, or
        session user) must be Pro; Free and anonymous callers get
        `403 PRO_REQUIRED`. Each call spends one request of the caller's
        data budget (`RateLimit-*`). The token lives 15 minutes
        (`expires_at`, Unix seconds): fetch a new one shortly before it
        expires, not per frame. Never cacheable (`Cache-Control: no-store`).

        `404` when this server has no Pro map token key configured.
      operationId: getMapsToken
      tags:
      - Weather
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: A token for the maps origin's `/pro/` path.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `MapsToken` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                type: object
                required:
                - token
                - expires_at
                - prefix
                properties:
                  token:
                    type: string
                    description: |
                      Opaque. Send as `Authorization: Bearer <token>` to the maps origin.
                  expires_at:
                    type: integer
                    format: int64
                    description: When the token stops working, Unix seconds (at most 15 minutes after
                      issue).
                  prefix:
                    type: string
                    description: The maps-origin path prefix the token opens.
                    example: /pro/
              example:
                token: eyJzdWIiOiJ1c2VyOjdkNmMxYjllLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMSIsImV4cCI6MTc2MTQzNzcwMCwicHJlZml4IjoiL3Byby8ifQ.3JYH0o2B3k4m3m2Dq0v8yq6m3o2Vv3Q7cK0a3c6sYxU
                expires_at: 1761437700
                prefix: /pro/
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          description: The caller's effective tier is not Pro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PRO_REQUIRED
                message: Maps past 10 days and the individual model layers require a Pro subscription;
                  authenticate with a Pro session or API key
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '404':
          description: No Pro map token key is configured on this server (error NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/locations/{state}/{slug}/current:
    get:
      summary: Current conditions from nearest sensors
      operationId: getCurrentConditions
      description: |
        Returns latest observation data from sensors within 25km of the location. Includes sensor-type-specific fields: SNOTEL (SWE, snow depth, percent of median), METAR (pressure, visibility), RWIS (pavement temp, road condition), AgriMet (solar radiation). Only includes observations from the last 3 hours. **Optional auth / free tier:** works without credentials; unauthenticated requests are rate-limited per IP (HTTP 429 with Retry-After).
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: State (e.g., "oregon", "washington", or "california")
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: |
          Location slug (e.g., "mt-hood-meadows"); an airport's FAA code or
          the legacy camelCase name resolve as aliases, and a retired or
          renamed slug resolves to its canonical location.
      - name: sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated allowlist of observation sources to include. Overrides defaults when present. Example: `snotel,ski_resort`.
      - name: exclude_sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated denylist, unioned with the built-in deny set (cocorahs / usgs / ndbc / rawinsonde).
      - name: units
        in: query
        schema:
          type: string
          enum:
          - metric
          - imperial
          - kelvin
          default: metric
        description: Unit system for the `nowcast_hours` band and `current` block values.
      - $ref: '#/components/parameters/Format'
      - name: include
        in: query
        schema:
          type: string
          enum:
          - nowcast_hours
        description: |
          Opt-in sections, comma-separated. `nowcast_hours` adds the obs-blended band (for clients overlaying it on a cached `nowcast=false` forecast). An unknown name is a 400.
      responses:
        '200':
          description: |
            Current sensor observations plus the Layer-B overlay: `nowcast_hours` carries the obs-blended forecast hours whose valid times fall in [now − 1h, now + 10h] (same shape as the forecast `timeseries` points; null when no cycle is servable), `as_of` is the overlay timestamp, and `model_run_initialized_at` identifies the underlying run so clients can detect a cycle rollover and refetch the cached base forecast. Merge contract: for valid times present in `nowcast_hours`, this band WINS over a cached `?nowcast=false` base response. For an anonymous caller it is shared-cacheable for well under a minute (inside the ~2 min alert refresh), for a caller with an API key or session private; the `ETag` digests the content (all but `as_of`), and a matching `If-None-Match` is `304`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Link:
              schema:
                type: string
              description: |
                `</api/v1/attribution>; rel="license"`: the data-source credits, licences and required notices this response's `attribution` block refers to.
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `CurrentObservationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
