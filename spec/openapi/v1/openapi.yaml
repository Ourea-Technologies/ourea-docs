                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `AlertsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
