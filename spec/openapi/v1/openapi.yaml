  /api/v1/locations/{state}/{slug}/nearby:
    get:
      summary: Nearest locations to a location
      operationId: getNearbyLocations
      description: |
        The location itself and its `limit` nearest public locations (no observation stations, never the location itself) within `radius_km`, nearest first, in any state. For "nearby" links beside a forecast: ask for the few rows you show instead of downloading a state list. The neighbours count against the hourly catalog-row budget as `count` rows, not as a list page. **Optional auth / free tier:** works without credentials; unauthenticated requests are budgeted per client address. Edge-cached like the location lists.
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code or state name (e.g., "or", "oregon")
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Location slug, code or legacy name, as on the forecast route
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
        description: Neighbours wanted (clamped to 1..20).
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 50
        description: Search radius in km; larger values are capped at 100.
      - name: units
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitSystem'
        description: |
          Units for the rows' `elevations[].elevation` (m or ft; `kelvin` is metric here). `elevation_m` is always metres and `distance_km` always km.
      - $ref: '#/components/parameters/Format'
