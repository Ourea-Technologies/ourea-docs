        Published, non-deleted catalog locations INSIDE the active
        coverage window (the `[coverage]` bbox in server config): a
        listed place always has a servable forecast page. Published
        rows outside coverage are hidden here and 404 by slug until
        coverage grows. Cursor-paginated by `(updated_at DESC, id
        DESC)`; follow `next_cursor` until it is null. Public — no
        auth required.
