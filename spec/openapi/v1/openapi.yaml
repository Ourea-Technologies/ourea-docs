  /api/v1/search/locations:
    get:
      summary: Search locations by name
      description: |
        Fast text search over the published catalog (in-memory index —
        no database on this path). Match tiers: exact name, then name
        prefix, then word prefix ("york" finds "New York"), then
        substring; deterministic ranking (cities before trailheads,
        shorter names first). A trailing state token in `q` ("boston
        ma", "boston massachusetts") is a SOFT hint: that state's
        matches rank first but other states still appear. The `state` /
        `county` / `type` parameters are HARD filters — use them when
        the state is known so users can never pick the wrong state's
        town. Observation stations never appear unless explicitly
        requested via `type=observation_station`. Public — no auth
        required.

        Key results by `key` (`"<state>-<slug>"`, lowercase state), an
        opaque identity; a slug is globally unique (the catalog
        holds one row per slug), so the slug alone identifies the place too.
      operationId: searchLocations
      tags:
      - Catalog
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
        description: Free-text query, minimum 2 characters after normalization (lowercased, diacritics
          folded, punctuation ignored).
        example: boston ma
      - name: state
        in: query
        schema:
          type: string
        description: Hard filter — two-letter code or full state name.
        example: MA
      - name: county
        in: query
        schema:
          type: string
        description: Hard filter — county name (case/punctuation-insensitive).
        example: Suffolk
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
        description: Hard filter — location type, snake_case (`ski_area`, `climbing_area`, `summit`);
          another spelling (camelCase, PascalCase) is a 301 to it. Required to surface `observation_station`
          rows.
        example: ski_area
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Max hits. Out-of-range values clamp to 1-100.
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: Ranked search hits, best first.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `SearchLocationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/SearchLocationsResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: |
            `q` shorter than 2 normalized characters, unknown `state`, or unknown `type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/catalog/locations:
