openapi: 3.1.0
info:
  title: Ourea Weather API (public)
  version: 1.0.0
  description: |
    Ensemble weather forecasts for the contiguous United States, blended from
    up to five weather models per forecast hour (ECMWF AIFS-ENS and IFS-ENS,
    NOAA AIGEFS, GEFS and RRFS), with every hour's full distribution served
    beside its headline numbers.

    ## Authentication
    Send an API key in the `X-API-Key` header. Forecast, current-conditions and
    alert routes also answer without credentials at the Free tier (10-day
    horizon, latest run only, members as the plume view). Forecasts at
    arbitrary coordinates (`GET /api/v1/forecast`) require Pro. The catalog and
    search routes need no credentials.

    ## Rate limits
    Every route here is budgeted per caller: per account or API key, or per
    client address without credentials. A token bucket (a burst, refilled at a
    sustained per-minute rate), a daily quota, and an hourly budget of catalog
    rows (list pages and search hits) apply, larger for Pro than for Free or
    anonymous callers. Every response carries `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset` and `RateLimit-Policy`, except
    one a shared cache may store (such as an anonymous forecast or list),
    which carries none; over a
    budget is `429` with `Retry-After`. Without credentials or on Free, list
    pages are capped (a state list without `limit` is the first page, with
    `next_cursor`), and a caller reading very many distinct locations in an
    hour, or walking the catalog in order, is slowed for an hour. Read the
    headers rather than hard-coding numbers; for bulk access, contact us.

    ## CORS
    Browser apps on any origin can call every route here. A request without
    cookies (anonymous, or with `X-API-Key`) is answered
    `Access-Control-Allow-Origin: *`; a preflight allows `GET`, `HEAD` and the
    request headers `X-API-Key` and `If-None-Match`, and may be cached for
    7200 s. A page can read `ETag`, `RateLimit-*`, `Retry-After`,
    `X-Request-Id`, `Deprecation`, `Sunset` and `Link`. A key in browser code
    is public: call anonymously from a browser, and keep a Pro key behind your
    own server.

    ## Errors
    Every error is one JSON envelope: `error` (a machine code: branch on it),
    `message`, and `request_id` -- the same value as the `X-Request-Id` header
    every response carries; quote it in a support request. A `400` about one
    query parameter names it in `param`, and `doc_url` links the code's
    explanation. Every `503` and `504` carries `Retry-After` (seconds): back off
    by it. A point outside the forecast coverage window is
    `404 OUTSIDE_COVERAGE`; a malformed coordinate is `400 INVALID_COORDINATES`.

    ## Coordinates and privacy
    A coordinate request (`/api/v1/forecast`, `/api/v1/current`,
    `/api/v1/alerts`, `/api/v1/nearby`) is served at the point quantized to
    0.01° (~1 km), so round a device's coordinates to 2 decimals before sending
    them: it costs nothing. The server's logs record the request path, never
    the coordinates.

    ## Units
    `units=metric` (default): Celsius, mm, m/s, meters.
    `units=imperial`: Fahrenheit, inches, mph, feet.
    `units=kelvin`: as metric, with temperatures in Kelvin.
    A field whose name ends `_m` is always metres (`elevation_m`), whatever
    `units` is; an unsuffixed length follows `units`. Precipitation and
    snowfall are mm (in); an observed snow depth is cm (in); an observed
    visibility is m (statute miles); a ceiling is m (ft).

    ## Locations
    A location is addressed by state (USPS code or name) and slug:
    `/api/v1/locations/or/mt-hood-meadows`. A slug is globally unique. Use the
    search and catalog routes to find slugs.

    ## Language
    Display text (`condition_text`, `storm_orientation_description`, error
    `message`s) is English. Switch on the codes beside it (`condition`,
    `condition_icon`, `error`), never on the text. A `lang=` query parameter is
    reserved for localised text (not accepted yet); the API never varies by
    `Accept-Language`, which would split the URL-keyed edge cache.

    ## Finding places
    Three routes list places. Each search hit, list row and catalog entry
    carries the `state` and `slug` that address the place's forecast,
    `/api/v1/locations/{state}/{slug}`:
    - `GET /api/v1/search/locations?q=` for what a user types: fuzzy and
      ranked, with optional `state`, `county` and `type` filters.
    - `GET /api/v1/locations/{state}` to browse one state's forecast
      locations: slug-ordered pages with `next_cursor`.
    - `GET /api/v1/catalog/locations` (beta) to sync the catalog in bulk with
      its metadata: filters and cursor paging, and
      `/api/v1/catalog/locations/{slug}` for one entry's detail.

    ## Canonical URLs
    One request is one URL, so it is one shared edge-cache entry. A GET whose
    URL is not canonical is answered `301 Moved Permanently` (cacheable for an
    hour) with the canonical URL in `Location`. On every route:
    - each query parameter under its own name: `units`, not `unit_system`;
    - each comma list -- `sources`, `exclude_sources`, `diagnostics`,
      `elevations`, `feels_like`, `include`, `network`, `capability` -- sorted and
      de-duplicated, its items joined by a literal `,`
      (`sources=gefs,ifs_ens`, not `sources=ifs_ens,gefs`); `capability` is
      one comma list (`capability=air_temp,swe`), never the parameter repeated;
    - `prob` and `totals` (forecasts) in their canonical spelling, below;
    - parameters in alphabetical order by name.

    On `/api/v1/locations`, `/api/v1/locations/{state}` and
    `/api/v1/locations/{state}/{slug}[/current|/alerts|/nearby]`, also:
    - the state as its lowercase USPS code (`or`, not `oregon` or `OR`);
    - the location as its catalog slug (not an airport code, a legacy
      camelCase name or a retired slug);
    - no query parameter at its fixed default (`units=metric`, `format=json`,
      `max_hours=24`, `nowcast=true`, `daily=true`, `hourly=true`,
      `include_past=false`, `models=false`, `members=false`, `feels_like=nws`;
      on `/nearby` `limit=3`, `radius_km=50`);
    - `prob` and `totals` in their canonical spelling: terms sorted by
      variable, then operator, window, aggregation and threshold, duplicates
      removed; each threshold printed at its variable's served precision in
      the request's units (imperial amounts 3 decimals, `6.000`; metric
      amounts 2; temperature and wind speed 1; snow level 0); the window token
      always present (`24h` for a window from hour 0, `6-18h` otherwise); the
      default aggregation omitted (`total` for precipitation and snowfall,
      `any` otherwise in `prob`); a `totals` window `min`/`max` always
      spelled (it has no default). E.g.
      `prob=snowfall:ge:6.000:24h,temperature:le:32.0:48h` with
      `units=imperial`,
      `totals=precipitation:24h,temperature:24h:min,temperature:24h:max`.

    Two differences are served as sent, with no redirect: parameter order
    alone, and percent-encoding alone (`totals=snowfall%3A24h` or
    `sources=gefs%2Cifs_ens` from a standard URL encoder is canonical). But
    the edge cache keys on the URL exactly as sent, so send the canonical order and the literal `:` and `,` to share the
    cache entry with every other caller. A request with an unknown parameter
    gets its `400` and an unknown state or place its `404`, not a redirect.

    ## The hourly series starts now
    A forecast's hourly `timeseries` starts at the hour containing the request
    time and `max_hours` counts forward from it: `max_hours=48` is the current
    hour plus the next 48. `include_past=true` serves the series from the model
    run's init instead, the hours already past included. The `daily` rows cover
    whole local days either way, in the location's IANA `timezone`
    (`location.timezone`), and start at TODAY's local date there (`max_days`
    counts from it); today's row is the whole day, not the hours left. With
    `include_past=true` or a pinned `run` they start at the run's first local
    date.

    ## Versioning
    v1 changes only additively: ignore unknown fields and treat unknown enum
    values as "other"; breaking changes go to `/api/v2`. A deprecated field,
    parameter or route is announced at least six months ahead, and responses
    using it carry `Deprecation`, `Sunset` and a `Link` with
    `rel="deprecation"`. `info.version` is the contract version (1.0.0 at the
    v1 lock). Operations and fields marked `x-beta: true` may change or be
    removed with notice in the changelog; they are not covered by the
    additive-only promise.

    ## Data sources and attribution
    Forecast, current-conditions and alert responses carry an `attribution`
    block naming exactly the data sources that response drew on, one credit
    line per provider, and the path of the full notices; they also send
    `Link: </api/v1/attribution>; rel="license"`. `GET /api/v1/attribution`
    (no credentials) lists every source with its provider's licence, terms
    page and required statements. ECMWF data are CC BY 4.0 and served
    modified: if you redistribute Ourea output, carry `attribution.credit`
    with it.
  contact:
    name: Ourea Weather
  license:
    name: Proprietary
servers:
- url: https://api.oureawx.com
security:
- apiKey: []
paths:
  /api/v1/locations:
    get:
      summary: List every forecast location (all states + sensors), one page at a time
      description: |
        Walks every location in the catalog — public points from the
        every state's catalog (CONUS-wide) plus every observation-network sensor
        site — in slug-ordered pages. Filter by category with `type=`.
        This list is always paged; the first call returns the
        first `limit` rows (default 500, maximum 5000; at
        most 500 for anonymous and 1000 for Free callers) and a
        `next_cursor` to pass back as `cursor`. Pages draw on the caller's hourly
        catalog-row budget (see "Rate limiting"), so a full walk of the
        ~450k-row catalog is not an anonymous or Free operation; for
        lookup use `/api/v1/search/locations`.
      operationId: getAllLocations
      tags:
      - Locations
      security:
      - apiKey: []
      - {}
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: limit
        in: query
        description: |
          Page size (1–5000); defaults to 500, the anonymous
          cap, on this route (the all-states list is never returned
          whole — it is ~450k rows / 116 MB). Capped at 500 for
          anonymous and 1000 for Free callers. Pages are ordered by slug;
          `next_cursor` in the response is the slug to pass back as
          `cursor` for the following page, with the same `limit` and
          `type` filter. The last page's `next_cursor` is `null`.
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
      - name: cursor
        in: query
        description: The `next_cursor` from the previous page.
        schema:
          type: string
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: One slug-ordered page of the location catalog; `next_cursor` is `null` on the last
            page
          headers:
            Cache-Control:
              $ref: '#/components/headers/ListCacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ListLocationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/locations/{state}:
    get:
      summary: List forecast locations for a state
      operationId: getLocations
      tags:
      - Locations
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
          example: co
        description: |
          Any US state or DC, as its two-letter USPS code (`co`, `NY`) or
          its name with spaces optional (`colorado`, `New York`), case-
          insensitive. Locations are served CONUS-wide; a state
          with no onboarded locations answers 404 with "No locations
          onboarded in X yet", an unknown segment 404s with "State 'X' not
          recognized".
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: limit
        in: query
        description: |
          Page size (1–5000). Absent: the whole state for a Pro
          caller; an anonymous or Free caller gets one page of
          its class's largest page (500 / 1000) with `next_cursor` —
          asking for more does not raise that cap. Pages are ordered by slug; `next_cursor` in
          the response is the slug to pass back as `cursor` for the
          following page, with the same `limit` and `type` filter. The
          last page's (and a whole state's) `next_cursor` is `null`.
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: cursor
        in: query
        description: The `next_cursor` from the previous page.
        schema:
          type: string
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Location list, or one page of it when `limit` is given or the caller is anonymous
            or Free
          headers:
            Cache-Control:
              $ref: '#/components/headers/ListCacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ListLocationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/locations/{state}/{slug}:
    get:
      summary: Get location forecast
      description: |
        Returns ensemble forecast with hourly timeseries and daily summaries.

        **The hourly series starts at the current hour.** `forecast.timeseries` begins at the hour containing
        the request time and runs `max_hours` past it (as far as the model
        run reaches); `include_past=true` serves it from the run's init. The
        `daily` rows cover whole local days either way, and start
        at the location's CURRENT local date (`location.timezone`) --
        today's row is still the whole day, its high possibly already past;
        with `include_past=true` or a pinned `run` they start at the run's
        first local date.

        `{slug}` is the location's catalog slug, dash-separated
        (`timberline-lodge`, `mt-hood-meadows`), as every response serves it;
        an airport's FAA code (`pdx`, `eug`) and the legacy camelCase name
        (`mtHoodMeadows`) still resolve as aliases, as do retired and renamed
        slugs, which answer with their canonical location (see "Canonical URLs").

        **Optional auth / free tier:** this route works without credentials.
        Unauthenticated requests are served at the Free tier: 10-day horizon
        (240 h max), latest run only, no per-model data, and members as the
        plume view (`?members=true`: temperature, precipitation, snow level,
        snowfall). Authenticated Pro users receive the full 15-day
        horizon (360 h), per-model breakdowns (`?models=true`), and every
        member variable (`?members=true`). Unauthenticated requests are rate-limited per IP
        (HTTP 429 with `Retry-After` header when the window is exceeded).

        **Ensemble plumes.** One request carries every model's
        members for every hour:
        `?daily=false&max_hours=240&members=true&nowcast=false&units=imperial`
        (parameters in alphabetical order, the canonical URL: the edge cache
        keys on the exact URL; `max_hours` defaults to 24 and is clamped to
        the tier). Each `forecast.timeseries[]` hour carries `members`, one
        entry per model; a member is `(model, member_id)`. A member's `precipitation` and
        `snowfall` are the totals over the `precipitation_hours` hours
        ending at `valid_time` (the 6-hourly models have values at every
        6th hour only). Each member carries its running totals
        (`cumulative_precipitation`, `cumulative_snowfall`) over the served
        window -- the same window as `snow_outlook` -- and the synoptic
        hours carry their distribution (`members_cumulative`):
        clients draw these served fields and compute nothing. Members are
        at `location.elevation_m` (and on each served `elevation_forecasts[]`
        entry at its elevation). The headline total is the blend's
        mean, served as `snow_outlook`, not the members' mean; a
        served headline running total is to come. The
        guide, with a worked example and the chart recipe:
        https://docs.oureawx.com/features/plumes/.
      operationId: getLocationForecast
      tags:
      - Forecasts
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
          example: co
        description: |
          Any US state or DC, as its two-letter USPS code (`co`, `NY`) or
          its name with spaces optional (`colorado`, `New York`), case-
          insensitive. Locations are served CONUS-wide; a state
          with no onboarded locations answers 404 with "No locations
          onboarded in X yet", an unknown segment 404s with "State 'X' not
          recognized".
      - name: slug
        in: path
        required: true
        description: |
          The location's catalog slug (`mt-hood-meadows`), from search,
          a state list or the catalog. An airport's FAA code, a legacy
          camelCase name or a retired slug answers 301 to the canonical
          URL (see "Canonical URLs").
        schema:
          type: string
        examples:
          ski_area:
            value: mt-hood-meadows
            summary: Mt Hood Meadows
          pass:
            value: santiam-pass
            summary: Santiam Pass
          airportCode:
            value: pdx
            summary: Portland International Airport, by its FAA code (an alias)
          legacyName:
            value: mtHoodMeadows
            summary: Mt Hood Meadows, by its legacy camelCase name (an alias)
      - name: max_hours
        in: query
        schema:
          type: integer
          minimum: 6
          maximum: 360
          default: 24
        description: |
          Hours of the hourly series past its first hour, clamped to the tier's outlook (Free 240, Pro 360). Counted from the CURRENT hour (the hour containing the request time), so `max_hours=48` returns that hour plus the next 48 -- 49 points; with `include_past=true` (or a pinned `run`) counted from the run's init. The series ends where the model run ends (lead 360), so near the cap fewer hours come back.
      - name: include_past
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Serve the hourly series from the model run's init, the hours already past included, for research and verification. Default `false`: the series starts at the current hour. A pinned `run` is always served from its init. `daily` is identical either way; `snow_outlook` opens at the first served hour. A body served from init does not roll over at the hour boundary (see `nowcast`).
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: models
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Include per-model breakdowns. Pro: a Free caller (anonymous or a Free key) asking for it gets `403 PRO_REQUIRED`.
      - name: members
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Include individual member values. Free callers receive the plume view (temperature, precipitation + `precipitation_hours`, snow level, snowfall); Pro receives every member variable. The response's `members_view` says which. Members ride on the hourly series (none with `hourly=false`) at the location's primary elevation, and on each served `elevation_forecasts[].hourly` at that elevation, lapsed and PRISM-carried there as its headline is; for a plume ask for the whole horizon (`max_hours=240`, Pro `360`). Every member carries its running totals (`cumulative_precipitation`, `cumulative_snowfall`) over the served window, and the synoptic hours carry their distribution (`members_cumulative`), in both views. With `nowcast=false` the plume is the cacheable base layer: `Cache-Control` runs to the next expected model cycle (or the hour boundary), under an ETag naming the served cycles, the representation and the tier (304 on `If-None-Match`).
      - name: elevations
        in: query
        schema:
          type: string
        examples:
          all:
            value: all
          one:
            summary: one named elevation
            value: summit
          several:
            value: base,summit
        description: |
          Include elevation forecasts (ski areas) in `elevation_forecasts`: `all` for every extra elevation, or a comma-separated list of the location's elevation names (`location.elevations[].name`; case, `-`, `_` and spaces ignored) for just those. Naming the primary's own elevation adds no entry (its forecast is `forecast`). A name the location does not have is a 400 listing its names. Each served elevation is a full point forecast, so this costs roughly one extra forecast build per elevation -- and with `members=true` one extra plume each, which is why a client drawing one elevation's plume should name it.
      - name: daily
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Include daily summaries. Their horizon is `max_days`, never `max_hours` (see `DailyForecast`).
      - name: max_days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 15
        description: |
          The number of `daily` rows -- `max_days` LOCAL dates, starting at the location's current local date (with `include_past=true` or a pinned `run`, at the local date of the run's forecast hour 1) -- independent of `max_hours`. Default: the tier's full horizon (Free 10, Pro 15). Clamped to `1..=` that horizon, as `max_hours` is clamped to the tier's outlook. Fewer rows come back only when the model run ends first (a date is served once the run reaches 23:00 local on it; see `DailyForecast`). Ignored with `daily=false`.
        example: 7
      - name: hourly
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Include the hourly `timeseries` (and each `elevation_forecasts[]` entry's `timeseries`/`hourly`). `false` serves the daily summaries alone: the keys are omitted, the hourly points are never computed, `max_hours` is ignored and `forecast.max_hours` is `0`. `daily`, `snow_outlook` and every other field are exactly what the same request with `hourly=true` returns, except `current`, which is read off the served hours and is therefore omitted. For daily-only consumers this is the cheap request: `hourly=false&max_days=7` is a fraction of the payload of `max_hours=168`. `hourly=false&daily=false` is a 400.
      - name: run
        in: query
        schema:
          type: string
          format: date-time
        description: |
          Specific init time for historical queries. A pinned run's hourly series is served from its init (as with `include_past=true`). Pro: a Free caller asking for it gets `403 PRO_REQUIRED`.
      - name: sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated allowlist of observation sources used for the nowcast blend and `nearest_sensors`. Overrides the built-in per-variable allowlist when present. Example: `snotel,ski_resort`. Valid sources: agrimet, agweathernet, cdec, cimis, cocorahs, coop, ndbc, nws, raws, rawinsonde, rwis, ski_resort, snotel, tempest, usgs, wsdot.
      - name: exclude_sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated denylist, unioned with the built-in deny set (cocorahs / usgs / ndbc / rawinsonde — none carry a useful sub-hourly surface temperature). Example: `raws`.
      - name: nowcast
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Layer selector. `true` (default) = the merged legacy shape: hours 0–6 are blended with live observations, today's daily range is obs-clamped, gap-flow / nearest_sensors / overnight snow are populated. In those hours `precipitation` mixes the forecast with what the MRMS surface rain rate (a ~10 km neighbourhood mean) predicts for each hour's total: the radar's weight is full for the hour of the scan and falls to about half an hour later and an eighth by +6 h (a rate is never served as an hour's total). The hour in progress and the hour just ended read the rain the radar has already MEASURED where MRMS has published it: the radar-only 15-minute accumulations so far, plus the rate for the rest of the hour, or the whole past hour's accumulation. Time-varying, so for an anonymous caller it is shared-cacheable for a short time (about a minute, with a brief stale-while-revalidate window) and its `ETag` also digests the body. `false` = the PURE base forecast (Layer A): deterministic for the life of the served cycle, no live observation layers (`nowcast_applied: false`, `nearest_sensors` empty, no gap_flow, no overnight snow outlook), with an `ETag` naming the served cycle (the reference init and every model's own cycle), the binary version and a digest of the representation (the effective `max_hours`, `hourly`, `daily`/`max_days`, `units`, `models`, `members`, `elevations`, `run`, sources, the point and the caller's tier). For an anonymous caller (always Free) it is shared-cacheable until about the next expected model cycle, with a stale-while-revalidate window, and carries `Vary: Authorization, X-API-Key, Cookie`. On either layer a caller identified by API key or session gets a private response (browsers revalidate it) — the same URL is a different body per tier (the `max_hours`/`max_days` clamps, models, members), so no shared cache may hold it. Every ETag answers a matching `If-None-Match` with `304`. Read the exact lifetimes from `Cache-Control`: they are tuned without notice and are not part of the contract. A body whose hourly series starts at the current hour (the default) is current only until the next hour boundary, on both layers, and the base layer's `ETag` also names the first served hour. Across the boundary a cache may serve the previous body for at most 60 s while it revalidates, so `timeseries[0]` can be the hour just ended for up to a minute after it ends. With `include_past=true`, a pinned `run` or `hourly=false` nothing rolls at the hour. Clients using `nowcast=false` overlay the `nowcast_hours` band from `…/current?include=nowcast_hours` for valid times it covers. The default is `true`, permanently.
      - $ref: '#/components/parameters/Prob'
