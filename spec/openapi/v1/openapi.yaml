            Forecast unavailable. Also returned (`FORECAST_UNAVAILABLE`) when no forecast hour has a complete set of core variables — the system says it cannot serve the location rather than returning an envelope wrapped around an empty `timeseries`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
  /api/v1/locations/{state}/{slug}/alerts:
    get:
      summary: Active NWS alerts for a location
      operationId: getLocationAlerts
      description: |
        Active NWS watches, warnings, and advisories affecting the location, matched by NWS public-forecast/county zone (western winter products are issued on terrain-based forecast zones) and by warning polygon for convective products. Served with an `ETag` on the alerts and never shared-cached: safety data is revalidated on every request, but a poll of unchanged alerts with `If-None-Match` is a `304` with no body. Ingested upstream every ~2 minutes; the same array also appears on `…/current`. **Optional auth / free tier:** works without credentials; unauthenticated requests are rate-limited per IP.
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code path segment (e.g., "or", "nc")
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Location slug (e.g., "government-camp", "asheville")
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Active alerts (possibly empty) for the location.
          headers:
            ETag:
