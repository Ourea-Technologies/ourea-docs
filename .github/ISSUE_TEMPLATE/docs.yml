name: Docs problem
description: A page on docs.oureawx.com is wrong, unclear, out of date or missing something.
title: "Docs: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make the Ourea docs better. For a code example that fails, use the **Broken example** form instead.
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page (filled in when you came from the page's "Open an issue" link).
      placeholder: https://docs.oureawx.com/getting-started/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
      description: Quote the sentence if you can, and say what you expected to read.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
  - type: markdown
    attributes:
      value: Never paste an API key. Security problems go through private vulnerability reporting, not issues.
