  - name: Report a security vulnerability
    url: https://github.com/Ourea-Technologies/ourea-docs/security/advisories/new
    about: Privately, never in a public issue.
  - name: The docs
    url: https://docs.oureawx.com
    about: Guides, concepts and the API reference.
