name: Broken example
description: A code example on docs.oureawx.com fails, or returns something other than the page says.
title: "Example: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. If the example is in an SDK tab, it comes from that SDK's `examples/` directory, and the fix may belong there; we'll move it if so.
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://docs.oureawx.com/features/probabilities/
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Tab
      options: [curl, "Cap'n Proto", Python, TypeScript, Go, "C#", Java, Kotlin, Swift, "No-SDK quickstart"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the error output, the HTTP status and error code, and the `X-Request-Id` / `request_id` if there is one.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, and the runtime or tool versions (curl, capnp, Python, Node.js, ...).
  - type: markdown
    attributes:
      value: "**Never paste an API key.** Remove it from commands and output before you submit."
