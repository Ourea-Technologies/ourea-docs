name: Page feedback
description: Was this docs page helpful? (Opened from the "Was this page helpful?" links at the bottom of each page.)
title: "Feedback: "
labels: [feedback]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://docs.oureawx.com/getting-started/
    validations:
      required: true
  - type: input
    id: helpful
    attributes:
      label: Was it helpful?
      description: Yes or no.
      placeholder: "yes"
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Anything to add? (optional)
      description: What worked, or what you were looking for. Submitting without a comment is fine.
  - type: markdown
    attributes:
      value: Never paste an API key.
